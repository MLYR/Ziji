    LiquidityHoldCreated: { description: 首版或修订版 LiquidityHold 已创建；响应包含完整审计字段和新的强 ETag, headers: { ETag: { schema: { type: string, pattern: '^"[1-9][0-9]*"$' } } }, content: { application/json: { schema: { $ref: '#/components/schemas/LiquidityHoldEnvelope' } } } }
    LiquidityHoldOk: { description: LiquidityHold 已释放；响应包含完整审计字段和新的强 ETag, headers: { ETag: { schema: { type: string, pattern: '^"[1-9][0-9]*"$' } } }, content: { application/json: { schema: { $ref: '#/components/schemas/LiquidityHoldEnvelope' } } } }
    LiquidityHoldListOk: { description: 完整 LiquidityHold 修订历史，按 created_at DESC、id DESC 返回并使用不透明 keyset cursor, content: { application/json: { schema: { $ref: '#/components/schemas/LiquidityHoldListEnvelope' } } } }
    TransactionCreated: { description: 交易和不可变分录已创建, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/TransactionEnvelope' } } } }

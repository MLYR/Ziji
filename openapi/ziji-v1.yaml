    AccountOpeningBalance:
      type: object
      additionalProperties: false
      required: [amount, businessAt]
      description: 账户创建期初余额；正数金额在入账时按账户币种精度校验。ASSET/INVESTMENT 只登记 PRIMARY 期初现金，LIABILITY 登记正债务；不接收业务日期、时区、分录或系统科目。
      properties:
        amount: { $ref: '#/components/schemas/PositiveMoney' }
        businessAt: { type: string, format: date-time }
        note: { type: [string, 'null'], maxLength: 500 }
    UpdateAccountRequest:
      type: object
      additionalProperties: false
      minProperties: 1

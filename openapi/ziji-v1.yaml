    LiabilityDetail:
      type: object
      additionalProperties: false
      required: [accountId, interestRate, loanDate, dueDate, billingDay, repaymentDay, currentAmountDue, version]
      description: 独立负债详情读取投影。无持久化行时六个业务字段均为 null、version=0、响应强 ETag 为 "0"；持久化详情 version 从 1 开始。
      properties:
        accountId: { type: string, format: uuid }
        interestRate: { type: [string, 'null'], pattern: '^(0(\.[0-9]{1,8})?|1(\.0{1,8})?)$', description: 年化比例，0.045 表示 4.5%。 }
        loanDate: { type: [string, 'null'], format: date }
        dueDate: { type: [string, 'null'], format: date }
        billingDay: { type: [integer, 'null'], minimum: 1, maximum: 31, description: 名义日；短月取月末，仅用于提醒。 }
        repaymentDay: { type: [integer, 'null'], minimum: 1, maximum: 31, description: 名义日；短月取月末，仅用于提醒。 }
        currentAmountDue:
          oneOf:
            - type: 'null'
            - { $ref: '#/components/schemas/NonNegativePostedMoney' }
          description: 账户币种精度内的非负提醒金额，不是账务余额事实。
          x-currency-precision: ACCOUNT_CURRENCY_AT_APPLICATION_BOUNDARY
        version: { type: integer, minimum: 0, description: 0 仅表示无持久行的虚拟空详情；持久化版本从 1 开始。 }
    PutLiabilityDetailRequest:
      type: object
      additionalProperties: false
      required: [interestRate, loanDate, dueDate, billingDay, repaymentDay, currentAmountDue]
      description: 完整替换负债详情；六个业务字段必须全部提交并可使用 null 清空。不适用 accountType 的字段返回 422。
      properties:
        interestRate: { type: [string, 'null'], pattern: '^(0(\.[0-9]{1,8})?|1(\.0{1,8})?)$' }
        loanDate: { type: [string, 'null'], format: date }
        dueDate: { type: [string, 'null'], format: date }
        billingDay: { type: [integer, 'null'], minimum: 1, maximum: 31 }
        repaymentDay: { type: [integer, 'null'], minimum: 1, maximum: 31 }
        currentAmountDue:
          oneOf:
            - type: 'null'
            - { $ref: '#/components/schemas/NonNegativePostedMoney' }
          x-currency-precision: ACCOUNT_CURRENCY_AT_APPLICATION_BOUNDARY
    PatchLiabilityDetailRequest:
      type: object
      additionalProperties: false
      minProperties: 1

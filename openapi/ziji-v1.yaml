        businessAt: { type: string, format: date-time }
        businessDate: { type: string, format: date }
        timezone: { type: [string, 'null'], minLength: 1, maxLength: 64 }
        note: { type: [string, 'null'], maxLength: 2000 }
        tagIds: { type: array, uniqueItems: true, maxItems: 20, items: { type: string, format: uuid } }
        assetAccountId: { type: string, format: uuid }
        liabilityAccountId: { type: string, format: uuid }
        currency: { $ref: '#/components/schemas/Currency' }
        amount: { $ref: '#/components/schemas/PositivePostedMoney' }
    LiabilityRepaymentTransactionRequest:
      description: 公共 discriminator LIABILITY_REPAYMENT 固定映射为领域和数据库 TransactionType.REPAYMENT。

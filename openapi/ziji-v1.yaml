        email: { type: string, format: email, maxLength: 320 }
        verificationCode: { type: string, pattern: '^[0-9]{6}$' }
        password: { type: string, minLength: 10, maxLength: 128, writeOnly: true }
        nickname: { type: string, minLength: 1, maxLength: 100 }
        timezone: { type: string, minLength: 1, maxLength: 64, default: Asia/Shanghai }
        baseCurrency: { $ref: '#/components/schemas/Currency' }
        locale: { type: string, minLength: 2, maxLength: 16 }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password, deviceName]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 1, maxLength: 128, writeOnly: true }
        deviceName: { type: string, minLength: 1, maxLength: 100 }
        deviceId: { type: [string, 'null'], maxLength: 200 }
    MobileRefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties: { refreshToken: { type: string, minLength: 32, maxLength: 500, writeOnly: true } }
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email, challengeCode, newPassword]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        challengeCode: { type: string, pattern: '^[0-9]{6}$' }
        newPassword: { type: string, minLength: 10, maxLength: 128, writeOnly: true }
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 128, writeOnly: true }
        newPassword: { type: string, minLength: 10, maxLength: 128, writeOnly: true }
    UpdateUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        nickname: { type: string, minLength: 1, maxLength: 100 }
        timezone: { type: string, minLength: 1, maxLength: 64 }
        baseCurrency: { $ref: '#/components/schemas/Currency' }
        locale: { type: string, minLength: 2, maxLength: 16 }
        amountFormat: { type: string, enum: [STANDARD, ACCOUNTING] }
    CreateAccountRequest:
      type: object
      additionalProperties: false
      required: [accountClass, accountType, name, currency]
      properties:
        id: { type: string, format: uuid }
        accountClass: { type: string, enum: [ASSET, LIABILITY, INVESTMENT] }
        accountType: { type: string, enum: [BANK, WECHAT, ALIPAY, CASH, BROKERAGE, CREDIT_CARD, LOAN, OTHER] }
        name: { type: string, minLength: 1, maxLength: 100 }
        currency: { $ref: '#/components/schemas/Currency' }
        institution: { type: [string, 'null'], maxLength: 120 }
        note: { type: [string, 'null'], maxLength: 2000 }
        openingBalance:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [amount, businessAt]
              properties:
                amount: { $ref: '#/components/schemas/PostedMoney' }
                businessAt: { type: string, format: date-time }
                note: { type: [string, 'null'], maxLength: 500 }
        creditLimit: { $ref: '#/components/schemas/NonNegativeMoney' }
    UpdateAccountRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        institution: { type: [string, 'null'], maxLength: 120 }
    ArchiveAccountRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties: { reason: { type: string, minLength: 1, maxLength: 500 } }
    CreateLiquidityHoldRequest:
      type: object
      additionalProperties: false
      required: [amount, effectiveAt, reason]
      properties:
        amount: { $ref: '#/components/schemas/PositiveMoney' }
        effectiveAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        reason: { type: string, minLength: 1, maxLength: 500 }
    ReviseLiquidityHoldRequest:
      type: object
      additionalProperties: false
      required: [amount, effectiveAt, reason, revisionReason]
      properties:
        amount: { $ref: '#/components/schemas/PositiveMoney' }
        effectiveAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        reason: { type: string, minLength: 1, maxLength: 500 }
        revisionReason: { type: string, minLength: 1, maxLength: 500 }
    MoneyAmount:
      oneOf:
        - { $ref: '#/components/schemas/CnyMoneyAmount' }
        - { $ref: '#/components/schemas/UsdMoneyAmount' }
        - { $ref: '#/components/schemas/HkdMoneyAmount' }
        - { $ref: '#/components/schemas/EurMoneyAmount' }
        - { $ref: '#/components/schemas/JpyMoneyAmount' }
    PositiveMoneyAmount:
      allOf:
        - { $ref: '#/components/schemas/MoneyAmount' }
        - type: object
          properties: { amount: { not: { const: '0' } } }
    CnyMoneyAmount:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties: { amount: { $ref: '#/components/schemas/NonNegativeCnyMoney' }, currency: { type: string, const: CNY } }
    UsdMoneyAmount:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties: { amount: { $ref: '#/components/schemas/NonNegativeCnyMoney' }, currency: { type: string, const: USD } }
    HkdMoneyAmount:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties: { amount: { $ref: '#/components/schemas/NonNegativeCnyMoney' }, currency: { type: string, const: HKD } }
    EurMoneyAmount:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties: { amount: { $ref: '#/components/schemas/NonNegativeCnyMoney' }, currency: { type: string, const: EUR } }
    JpyMoneyAmount:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties: { amount: { $ref: '#/components/schemas/NonNegativeJpyMoney' }, currency: { type: string, const: JPY } }
    PostTransactionRequest:
      oneOf:
        - { $ref: '#/components/schemas/OpeningTransactionRequest' }
        - { $ref: '#/components/schemas/IncomeTransactionRequest' }
        - { $ref: '#/components/schemas/ExpenseTransactionRequest' }
        - { $ref: '#/components/schemas/RefundTransactionRequest' }
        - { $ref: '#/components/schemas/TransferTransactionRequest' }
        - { $ref: '#/components/schemas/LiabilityRepaymentTransactionRequest' }
      discriminator:
        propertyName: type
        mapping:
          OPENING: '#/components/schemas/OpeningTransactionRequest'
          INCOME: '#/components/schemas/IncomeTransactionRequest'
          EXPENSE: '#/components/schemas/ExpenseTransactionRequest'
          REFUND: '#/components/schemas/RefundTransactionRequest'
          TRANSFER: '#/components/schemas/TransferTransactionRequest'
          LIABILITY_REPAYMENT: '#/components/schemas/LiabilityRepaymentTransactionRequest'
    TransactionCommandBase:
      type: object
      required: [type, businessAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [OPENING, INCOME, EXPENSE, REFUND, TRANSFER, LIABILITY_REPAYMENT] }
        businessAt: { type: string, format: date-time }
        businessDate: { type: string, format: date }
        timezone: { type: [string, 'null'], minLength: 1, maxLength: 64 }
        note: { type: [string, 'null'], maxLength: 2000 }
        tagIds: { type: array, uniqueItems: true, maxItems: 20, items: { type: string, format: uuid } }
    OpeningTransactionRequest:
      unevaluatedProperties: false
      allOf:
        - { $ref: '#/components/schemas/TransactionCommandBase' }
        - type: object
          required: [type, accountId, amount, currency]
          properties:
            type: { type: string, const: OPENING }
            accountId: { type: string, format: uuid }
            amount: { $ref: '#/components/schemas/PostedMoney' }
            currency: { $ref: '#/components/schemas/Currency' }
    IncomeTransactionRequest:
      unevaluatedProperties: false
      allOf:
        - { $ref: '#/components/schemas/TransactionCommandBase' }
        - type: object
          required: [type, accountId, amount, currency, categoryId]
          properties:
            type: { type: string, const: INCOME }
            accountId: { type: string, format: uuid }
            amount: { $ref: '#/components/schemas/PositivePostedMoney' }
            currency: { $ref: '#/components/schemas/Currency' }
            categoryId: { type: string, format: uuid }
            counterparty: { type: [string, 'null'], maxLength: 200 }
    ExpenseTransactionRequest:
      unevaluatedProperties: false
      allOf:
        - { $ref: '#/components/schemas/TransactionCommandBase' }
        - type: object
          required: [type, accountId, amount, currency, categoryId]
          properties:
            type: { type: string, const: EXPENSE }
            accountId: { type: string, format: uuid }
            amount: { $ref: '#/components/schemas/PositivePostedMoney' }
            currency: { $ref: '#/components/schemas/Currency' }
            categoryId: { type: string, format: uuid }
            merchant: { type: [string, 'null'], maxLength: 200 }
    RefundTransactionRequest:
      unevaluatedProperties: false
      allOf:
        - { $ref: '#/components/schemas/TransactionCommandBase' }
        - type: object
          required: [type, accountId, amount, currency, categoryId]
          properties:
            type: { type: string, const: REFUND }
            accountId: { type: string, format: uuid }
            amount: { $ref: '#/components/schemas/PositivePostedMoney' }
            currency: { $ref: '#/components/schemas/Currency' }
            categoryId: { type: string, format: uuid }
            originalTransactionId: { type: [string, 'null'], format: uuid }
    TransferTransactionRequest:
      unevaluatedProperties: false
      allOf:
        - { $ref: '#/components/schemas/TransactionCommandBase' }
        - type: object
          required: [type, fromAccountId, toAccountId, fromAmount, toAmount, fee]
          properties:
            type: { type: string, const: TRANSFER }
            fromAccountId: { type: string, format: uuid }
            toAccountId: { type: string, format: uuid }
            fromAmount: { $ref: '#/components/schemas/PositiveMoneyAmount' }
            toAmount: { $ref: '#/components/schemas/PositiveMoneyAmount' }
            fee: { $ref: '#/components/schemas/MoneyAmount' }
            feeCategoryId: { type: [string, 'null'], format: uuid }
            exchangeRate: { type: [string, 'null'], pattern: '^(0*[1-9][0-9]{0,27})(\.[0-9]{1,12})?$|^0\.[0-9]*[1-9][0-9]{0,11}$' }
    LiabilityRepaymentTransactionRequest:
      unevaluatedProperties: false
      allOf:
        - { $ref: '#/components/schemas/TransactionCommandBase' }
        - type: object
          required: [type, cashAccountId, liabilityAccountId, currency, principalAmount, interestAmount, feeAmount]
          properties:
            type: { type: string, const: LIABILITY_REPAYMENT }
            cashAccountId: { type: string, format: uuid }
            liabilityAccountId: { type: string, format: uuid }
            currency: { $ref: '#/components/schemas/Currency' }
            principalAmount: { $ref: '#/components/schemas/PositivePostedMoney' }
            interestAmount: { $ref: '#/components/schemas/NonNegativePostedMoney' }
            feeAmount: { $ref: '#/components/schemas/NonNegativePostedMoney' }
            interestCategoryId: { type: [string, 'null'], format: uuid }
            feeCategoryId: { type: [string, 'null'], format: uuid }
    ReviseTransactionRequest:
      type: object
      additionalProperties: false
      required: [reason, replacement]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
        replacement: { $ref: '#/components/schemas/PostTransactionRequest' }
    ReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties: { reason: { type: string, minLength: 1, maxLength: 500 } }
    BalanceAdjustmentRequest:
      type: object
      additionalProperties: false
      required: [actualBalance, businessAt, timezone, reason]
      properties:
        actualBalance: { $ref: '#/components/schemas/Money' }
        businessAt: { type: string, format: date-time }
        timezone: { type: string, minLength: 1, maxLength: 64 }
        reason: { type: string, minLength: 1, maxLength: 500 }
    CreateCategoryRequest:
      type: object
      additionalProperties: false
      required: [name, categoryType]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        categoryType: { type: string, enum: [INCOME, EXPENSE] }
        parentId: { type: [string, 'null'], format: uuid }
        accountId: { type: [string, 'null'], format: uuid }
    UpdateCategoryRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    MergeCategoryRequest:
      type: object
      additionalProperties: false
      required: [targetCategoryId]
      properties: { targetCategoryId: { type: string, format: uuid } }
    CreateTagRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties: { name: { type: string, minLength: 1, maxLength: 80 } }
    UpdateTagRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    CreateInvitationRequest:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        role: { type: string, enum: [OWNER, EDITOR, VIEWER] }
    UpdateMemberRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties: { role: { type: string, enum: [OWNER, EDITOR, VIEWER] } }
    OwnershipTransferRequest:
      type: object
      additionalProperties: false
      required: [targetMembershipId]
      properties: { targetMembershipId: { type: string, format: uuid } }
    SetInclusionSettingRequest:
      type: object
      additionalProperties: false
      required: [inclusionRatio, effectiveAt]
      properties:
        inclusionRatio: { $ref: '#/components/schemas/Ratio' }
        effectiveAt: { type: string, format: date-time }
    ImportUploadRequest:
      type: object
      additionalProperties: false
      required: [accountId, sourceType, file]
      properties:
        accountId: { type: string, format: uuid }
        sourceType: { type: string, enum: [WECHAT, ALIPAY, BANK_CSV, BANK_EXCEL, GENERIC_CSV] }
        file: { type: string, format: binary }
    ImportMappingRequest:
      type: object
      additionalProperties: false
      required: [columns]
      properties:

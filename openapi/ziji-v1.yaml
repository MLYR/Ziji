    TransactionListOk: { description: 当前用户 ACTIVE membership 可见的交易列表，固定按 businessDate DESC、transactionId DESC 返回不透明 keyset 分页结果, content: { application/json: { schema: { $ref: '#/components/schemas/TransactionListEnvelope' } } } }

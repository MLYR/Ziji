          maxProperties: 50
          additionalProperties: { type: string, maxLength: 100 }
        dateFormat: { type: [string, 'null'], maxLength: 40 }
        timezone: { type: [string, 'null'], maxLength: 64 }
    UpdateImportRowRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        decision: { type: string, enum: [PENDING, SKIP, IMPORT, MERGE] }
        merchant: { type: [string, 'null'], maxLength: 200 }
        note: { type: [string, 'null'], maxLength: 2000 }
        categoryId: { type: [string, 'null'], format: uuid }
        mergeTransactionId: { type: [string, 'null'], format: uuid }
    CreateInstrumentRequest:
      type: object
      additionalProperties: false
      required: [instrumentType, name, currency]
      properties:
        instrumentType: { type: string, enum: [STOCK, FUND, ETF, OTHER] }
        name: { type: string, minLength: 1, maxLength: 200 }
        market: { type: string, minLength: 1, maxLength: 40, default: MANUAL }
        currency: { $ref: '#/components/schemas/Currency' }
    CreatePriceRequest:
      type: object
      additionalProperties: false
      required: [priceType, businessDate, price, currency, reason]
      properties:
        priceType: { type: string, enum: [CLOSE, UNIT_NAV, ADJUSTED_CLOSE, MANUAL] }
        businessDate: { type: string, format: date }
        price: { $ref: '#/components/schemas/Rate' }
        currency: { $ref: '#/components/schemas/Currency' }
        reason: { type: string, minLength: 1, maxLength: 500 }
    CorrectPriceRequest:
      type: object
      additionalProperties: false
      required: [supersedesPriceId, price, reason]
      properties:
        supersedesPriceId: { type: string, format: uuid }
        price: { $ref: '#/components/schemas/Rate' }
        reason: { type: string, minLength: 1, maxLength: 500 }
    CreateInvestmentTradeRequest:
      type: object
      additionalProperties: false
      required: [side, investmentAccountId, instrumentId, currency, feeAmount, taxAmount, tradeAt]
      properties:
        id: { type: string, format: uuid }
        side: { type: string, enum: [BUY, SELL, DIVIDEND] }
        investmentAccountId: { type: string, format: uuid }
        instrumentId: { type: string, format: uuid }
        quantity: { $ref: '#/components/schemas/PositiveQuantity' }
        unitPrice: { $ref: '#/components/schemas/Rate' }
        dividendAmount: { $ref: '#/components/schemas/PositiveMoney' }
        currency: { $ref: '#/components/schemas/Currency' }
        feeAmount: { $ref: '#/components/schemas/NonNegativeMoney' }
        taxAmount: { $ref: '#/components/schemas/NonNegativeMoney' }
        tradeAt: { type: string, format: date-time }
    CreateExchangeRateRequest:
      type: object
      additionalProperties: false
      required: [baseCurrency, quoteCurrency, rate, businessAt, reason]
      properties:
        baseCurrency: { $ref: '#/components/schemas/Currency' }
        quoteCurrency: { $ref: '#/components/schemas/Currency' }
        rate: { $ref: '#/components/schemas/Rate' }
        businessAt: { type: string, format: date-time }
        reason: { type: string, minLength: 1, maxLength: 500 }
    CorrectExchangeRateRequest:
      type: object
      additionalProperties: false
      required: [rate, reason]
      properties:
        rate: { $ref: '#/components/schemas/Rate' }
        reason: { type: string, minLength: 1, maxLength: 500 }
    TransactionTemplate:
      type: object
      additionalProperties: false
      required: [schemaVersion, command]
      properties:
        schemaVersion: { type: integer, const: 1 }
        command: { $ref: '#/components/schemas/PostTransactionRequest' }
    CreateRecurringRuleRequest:
      type: object
      additionalProperties: false
      required: [accountId, transactionTemplate, frequency, intervalValue, startsOn]
      properties:
        accountId: { type: string, format: uuid }
        transactionTemplate: { $ref: '#/components/schemas/TransactionTemplate' }
        frequency: { type: string, enum: [DAILY, WEEKLY, MONTHLY, YEARLY] }
        intervalValue: { type: integer, minimum: 1, maximum: 365 }
        startsOn: { type: string, format: date }
        endsOn: { type: [string, 'null'], format: date }
    UpdateRecurringRuleRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        transactionTemplate: { $ref: '#/components/schemas/TransactionTemplate' }
        frequency: { type: string, enum: [DAILY, WEEKLY, MONTHLY, YEARLY] }
        intervalValue: { type: integer, minimum: 1, maximum: 365 }
        endsOn: { type: [string, 'null'], format: date }
        status: { type: string, enum: [ACTIVE, PAUSED, ENDED] }
    SyncOperation:
      type: object
      additionalProperties: false
      required: [operationId, idempotencyKey, entityType, entityId, operationType, payloadVersion, payload, createdAt]
      properties:
        operationId: { type: string, format: uuid }
        idempotencyKey: { type: string, minLength: 16, maxLength: 100 }
        entityType: { type: string, enum: [ACCOUNT, TRANSACTION, CATEGORY, TAG, RECURRING_RULE] }
        entityId: { type: string, format: uuid }
        operationType: { type: string, enum: [CREATE, UPDATE, REVERSE, ARCHIVE] }
        baseVersion: { type: [integer, 'null'], minimum: 1 }
        payloadVersion: { type: integer, const: 1 }
        payload:
          oneOf:
            - { $ref: '#/components/schemas/CreateAccountRequest' }
            - { $ref: '#/components/schemas/PostTransactionRequest' }
            - { $ref: '#/components/schemas/CreateCategoryRequest' }
            - { $ref: '#/components/schemas/CreateTagRequest' }
            - { $ref: '#/components/schemas/CreateRecurringRuleRequest' }
            - { $ref: '#/components/schemas/ReasonRequest' }
        createdAt: { type: string, format: date-time }
    ApplySyncOperationsRequest:
      type: object
      additionalProperties: false
      required: [deviceId, operations]
      properties:
        deviceId: { type: string, minLength: 1, maxLength: 200 }
        operations: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/SyncOperation' } }

    User:
      type: object
      additionalProperties: false
      required: [id, email, nickname, timezone, baseCurrency, locale, amountFormat, status, version]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        nickname: { type: string }
        timezone: { type: string }
        baseCurrency: { $ref: '#/components/schemas/Currency' }
        locale: { type: string }
        amountFormat: { type: string, enum: [STANDARD, ACCOUNTING] }
        status: { type: string, enum: [ACTIVE, LOCKED, CLOSING, CLOSED] }
        version: { type: integer, minimum: 1 }
    Session:
      type: object
      additionalProperties: false
      required: [id, deviceName, createdAt, lastSeenAt, status]
      properties:
        id: { type: string, format: uuid }
        deviceName: { type: string }
        deviceId: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        status: { type: string, enum: [ACTIVE, REVOKED, EXPIRED] }
    TokenPair:

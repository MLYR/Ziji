      x-requirement-ids: [REC-002]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '201': { $ref: '#/components/responses/TransactionCreated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /recurring-occurrences/{occurrenceId}/skip:
    parameters: [{ $ref: '#/components/parameters/OccurrenceId' }]
    post:
      tags: [Recurring]
      operationId: skipRecurringOccurrence
      summary: 跳过本次发生项
      x-requirement-ids: [REC-002]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: 已跳过 }
        '409': { $ref: '#/components/responses/Conflict' }

        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  # Data export is a download workflow. V1 uploads exist only for bill import.
  /users/me/exports:
    post:
      tags: [Users]
      operationId: createDataExport
      summary: 创建用户数据导出任务
      x-requirement-ids: [SEC-007]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '202': { $ref: '#/components/responses/DataExportAccepted' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /users/me/exports/{exportId}:
    parameters: [{ $ref: '#/components/parameters/ExportId' }]
    get:
      tags: [Users]
      operationId: getDataExport
      summary: 查询数据导出任务和短时下载地址
      x-requirement-ids: [SEC-007]
      responses:
        '200': { $ref: '#/components/responses/DataExportOk' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /users/me/account-closure:
    get:
      tags: [Users]
      operationId: getAccountClosure
      summary: 查询注销申请状态和影响
      x-requirement-ids: [SEC-007]
      responses:
        '200': { $ref: '#/components/responses/AccountClosureOk' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Users]
      operationId: createAccountClosure
      summary: 发起账号注销申请
      x-requirement-ids: [SEC-007]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '202': { $ref: '#/components/responses/AccountClosureAccepted' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Users]
      operationId: cancelAccountClosure
      summary: 冷静期内撤销注销申请
      x-requirement-ids: [SEC-007]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses:
        '204': { description: 注销申请已撤销, headers: { ETag: { description: 注销申请的新版本, schema: { type: string } } } }
        '409': { $ref: '#/components/responses/Conflict' }

        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  # Sync payloads reuse the same domain command schemas and still enforce current object permissions.
  /sync/changes:
    get:
      tags: [Sync]
      operationId: listSyncChanges
      summary: 按定向游标拉取增量变更
      x-requirement-ids: [SYNC-001, SYNC-003, SYNC-010]
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { $ref: '#/components/responses/SyncChangeListOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /sync/operations:
    post:
      tags: [Sync]
      operationId: applySyncOperations
      summary: 按顺序应用离线操作
      x-requirement-ids: [SYNC-001, SYNC-004, SYNC-006, SYNC-007, SYNC-009]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ApplySyncOperationsRequest' } }
      responses:
        '200': { $ref: '#/components/responses/SyncOperationResultsOk' }
        '400': { $ref: '#/components/responses/BadRequest' }

        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /async-jobs/{jobId}:
    parameters: [{ $ref: '#/components/parameters/JobId' }]
    get:
      tags: [Users]
      operationId: getAsyncJob
      summary: 查询当前用户可见的异步任务
      responses:
        '200': { $ref: '#/components/responses/AsyncJobOk' }
        '404': { $ref: '#/components/responses/NotFound' }

        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    webRefreshCookie:
      type: apiKey
      in: cookie
      name: ziji_refresh
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 认证写操作按当前用户形成幂等作用域；公开 registerUser 与 resetPassword 按版本化匿名主体形成幂等作用域；两者都与 API 主版本、OpenAPI operationId 和 Idempotency-Key 共同形成作用域。request Hash 必须包含实际资源标识、类型化业务载荷和 If-Match（无 If-Match 时使用显式缺失标记），格式校验、未认证、权限失败和资源不可见不得创建幂等记录；同键同参重放首次响应，同键异参返回 IDEMPOTENCY_KEY_REUSED。
      schema: { type: string, minLength: 16, maxLength: 100 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 资源 ETag，例如双引号包围的实体版本；具体资源可以通过更严格的专用 If-Match 参数冻结格式。
      schema: { type: string, minLength: 3, maxLength: 80 }
    ArchiveIfMatch:
      name: If-Match
      in: header
      required: true
      description: 账户归档运行时使用强 ETag，必须是双引号包围的正整数，例如 "7"；缺失、重复、弱 ETag、*、未加双引号、非正整数或溢出（超出服务端整数范围）均返回 400 VALIDATION_ERROR；格式正确但版本过期返回 409 VERSION_CONFLICT。机器 schema 保留与既有 If-Match 相同的兼容字符串范围，精确格式由运行时校验。
      x-runtime-pattern: '^"[1-9][0-9]*"$'
      schema: { type: string, minLength: 3, maxLength: 80 }
    LiquidityHoldIfMatch:
      name: If-Match
      in: header
      required: true
      description: LiquidityHold 修订和释放使用强 ETag，必须是双引号包围的正整数，例如 "7"；缺失、重复、弱 ETag、*、未加双引号、非正整数或溢出（超出服务端整数范围）均返回 400 VALIDATION_ERROR；格式正确但版本过期返回 409 VERSION_CONFLICT。
      schema: { type: string, minLength: 3, maxLength: 82, pattern: '^"[1-9][0-9]*"$' }
    LiabilityDetailIfMatch:
      name: If-Match
      in: header
      required: true
      description: 负债详情 PATCH 使用强 ETag，必须是双引号包围的正整数。缺失、重复、弱 ETag、*、未加双引号、零、负数、非数字或溢出均返回 400 VALIDATION_ERROR；格式正确但版本过期返回 409 VERSION_CONFLICT。虚拟空详情的 "0" 不能用于创建。
      schema: { type: string, minLength: 3, maxLength: 82, pattern: '^"[1-9][0-9]*"$' }
    LiabilityDetailPutIfMatch:
      name: If-Match
      in: header
      required: false
      description: 已有持久化负债详情的 PUT 完整替换必须携带此强 ETag；首次创建禁止携带。PUT 必须在此头和 If-None-Match 中恰好提交一个。
      schema: { type: string, minLength: 3, maxLength: 82, pattern: '^"[1-9][0-9]*"$' }
    LiabilityDetailIfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: 尚无持久化负债详情行时，首次 PUT 必须且只能提交 *；已有持久化行返回 409 VERSION_CONFLICT。PUT 必须在此头和 If-Match 中恰好提交一个。
      schema: { type: string, const: '*' }
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 200 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 500 }
    TransactionCursor:
      name: cursor
      in: query
      required: false
      description: listTransactions 生成的不透明 keyset 游标；绑定当前 userId、API 主版本、全部筛选条件和 businessDate DESC/transactionId DESC 排序定义。客户端不得解析；篡改、跨用户复用、边界错误或与筛选/排序不匹配均返回 400 VALIDATION_ERROR。
      schema: { type: string, minLength: 1, maxLength: 500 }
    DateFrom:
      name: dateFrom
      in: query
      required: false
      schema: { type: string, format: date }
    DateTo:
      name: dateTo
      in: query
      required: false
      schema: { type: string, format: date }
    AsOf:
      name: asOf
      in: query
      required: false
      schema: { type: string, format: date-time }
    CalendarMonth:
      name: month
      in: query
      required: true
      description: 用户时区下的自然月。
      schema: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
    InvestmentReturnScopeType:
      name: scopeType
      in: query
      required: true
      schema: { type: string, enum: [PORTFOLIO, INSTRUMENT] }
    AssetChangeMetric:
      name: metric
      in: query
      required: true
      description: 资产规模指标；变化率不是投资收益率。
      schema: { type: string, enum: [TOTAL_ASSETS, NET_ASSETS] }
    InstrumentIdQuery:
      name: instrumentId
      in: query
      required: false
      description: scopeType=INSTRUMENT 时必填，PORTFOLIO 时禁止。
      schema: { type: string, format: uuid }
    AccountIdQuery:
      name: accountId
      in: query
      required: false
      schema: { type: string, format: uuid }
    TransactionTypeQuery:
      name: type
      in: query
      required: false
      description: 复用领域 TransactionType 与 V003 的冻结值。
      schema: { type: string, enum: [OPENING, INCOME, EXPENSE, REFUND, TRANSFER, FX_TRANSFER, ADJUSTMENT, INVESTMENT, REPAYMENT, INTEREST, REVERSAL] }
    TransactionCategoryIdQuery:
      name: categoryId
      in: query
      required: false
      description: categories.id 的分类 UUID；既有分类类型仍为 INCOME/EXPENSE，分类可见性按当前 ACTIVE membership 和账户范围校验。
      schema: { type: string, format: uuid }
    BaseCurrency:
      name: baseCurrency
      in: query
      required: true
      schema: { $ref: '#/components/schemas/Currency' }
    QuoteCurrency:
      name: quoteCurrency
      in: query
      required: true
      schema: { $ref: '#/components/schemas/Currency' }
    Granularity:
      name: granularity
      in: query
      required: false
      schema: { type: string, enum: [DAY, WEEK, MONTH, YEAR], default: DAY }
    SearchQuery:
      name: q
      in: query
      required: true
      schema: { type: string, minLength: 1, maxLength: 100 }
    AccountId: { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
    BatchId: { name: batchId, in: path, required: true, schema: { type: string, format: uuid } }
    CategoryId: { name: categoryId, in: path, required: true, schema: { type: string, format: uuid } }
    ExportId: { name: exportId, in: path, required: true, schema: { type: string, format: uuid } }
    HoldId: { name: holdId, in: path, required: true, schema: { type: string, format: uuid } }
    InstrumentId: { name: instrumentId, in: path, required: true, schema: { type: string, format: uuid } }
    BusinessDate: { name: businessDate, in: path, required: true, schema: { type: string, format: date } }
    InvitationId: { name: invitationId, in: path, required: true, schema: { type: string, format: uuid } }
    InvitationToken: { name: token, in: path, required: true, schema: { type: string, minLength: 24, maxLength: 300 } }
    JobId: { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
    MemberId: { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
    OccurrenceId: { name: occurrenceId, in: path, required: true, schema: { type: string, format: uuid } }
    RateId: { name: rateId, in: path, required: true, schema: { type: string, format: uuid } }
    RowId: { name: rowId, in: path, required: true, schema: { type: string, format: uuid } }
    RuleId: { name: ruleId, in: path, required: true, schema: { type: string, format: uuid } }
    SessionId: { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
    TagId: { name: tagId, in: path, required: true, schema: { type: string, format: uuid } }
    TransactionId: { name: transactionId, in: path, required: true, schema: { type: string, format: uuid } }

  requestBodies:
    EmailChallengeRequest:
      required: true
      content:
        application/json: { schema: { $ref: '#/components/schemas/EmailChallengeRequest' } }
    LoginRequest:
      required: true
      content:
        application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } }

  schemas:
    # Financial values are decimal strings so JSON binary floating point never changes facts.
    # 普通客户端只提交语义命令；LedgerEntry 仅出现在只读响应，禁止作为写请求字段。
    Money:
      description: API 金额字符串最多 2 位小数；JPY 由同一对象的 currency 进一步限制为 0 位。
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,21})(\.[0-9]{1,2})?$'
    NonNegativeMoney:
      description: 非负 API 金额字符串；JPY 由同一对象的 currency 进一步限制为 0 位。
      type: string
      pattern: '^(0|[1-9][0-9]{0,21})(\.[0-9]{1,2})?$'
    PositiveMoney:
      description: 正 API 金额字符串；JPY 由同一对象的 currency 进一步限制为 0 位。
      type: string
      pattern: '^(0*[1-9][0-9]{0,21})(\.[0-9]{1,2})?$|^0\.(0[1-9]|[1-9][0-9]?)$'
    NonNegativePostedMoney:
      description: 非负入账金额，实际小数位由同一对象的 currency 决定。
      type: string
      pattern: '^(0|[1-9][0-9]{0,21})(\.[0-9]{1,2})?$'
    PositivePostedMoney:
      description: 正入账金额，实际小数位由同一对象的 currency 决定。
      type: string
      pattern: '^(0*[1-9][0-9]{0,21})(\.[0-9]{1,2})?$|^0\.(0[1-9]|[1-9][0-9]?)$'
    NonNegativeCnyMoney: { type: string, pattern: '^(0|[1-9][0-9]{0,21})(\.[0-9]{1,2})?$' }
    NonNegativeJpyMoney: { type: string, pattern: '^(0|[1-9][0-9]{0,21})$' }
    Quantity: { type: string, pattern: '^-?(0|[1-9][0-9]{0,27})(\.[0-9]{1,12})?$' }
    PositiveQuantity: { type: string, pattern: '^(0*[1-9][0-9]{0,27})(\.[0-9]{1,12})?$|^0\.[0-9]*[1-9][0-9]{0,11}$' }
    Rate: { type: string, pattern: '^(0*[1-9][0-9]{0,27})(\.[0-9]{1,12})?$|^0\.[0-9]*[1-9][0-9]{0,11}$' }
    Ratio: { type: string, pattern: '^(0|[1-9][0-9]{0,2})(\.[0-9]{1,6})?$' }
    Currency: { type: string, pattern: '^[A-Z]{3}$', examples: [CNY] }
    PageMeta:
      type: object
      additionalProperties: false
      required: [requestId, hasMore]
      properties:
        requestId: { type: string, minLength: 1, maxLength: 100 }
        nextCursor: { type: [string, 'null'], maxLength: 500 }
        hasMore: { type: boolean }
    TransactionPageMeta:
      type: object
      additionalProperties: false
      required: [requestId, nextCursor, hasMore]
      description: listTransactions 专用分页元数据；不改变其他列表响应的 PageMeta 必填字段。
      properties:
        requestId: { type: string, minLength: 1, maxLength: 100 }
        nextCursor: { type: [string, 'null'], maxLength: 500 }
        hasMore: { type: boolean }
    ResponseMeta:
      type: object
      additionalProperties: false
      required: [requestId]
      properties: { requestId: { type: string, minLength: 1, maxLength: 100 } }
    VersionConflictDetails:
      type: object
      additionalProperties: false
      required: [currentVersion, currentEtag, resourceLocation]
      properties:
        currentVersion: { type: integer, minimum: 1, description: 当前可见资源版本号 }
        currentEtag:
          type: string
          minLength: 3
          maxLength: 82
          pattern: '^"[1-9][0-9]*"$'
          description: 双引号包围的当前资源版本，例如 "7"。
        resourceLocation:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '^/(?!/)[^\s]*$'
          description: 以单个斜杠开头的相对 API 地址；不得以 // 开头。
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, requestId]
      properties:
        type: { type: string, format: uri }
        title: { type: string, maxLength: 200 }
        status: { type: integer, minimum: 400, maximum: 599 }
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,79}$' }
        detail: { type: [string, 'null'], maxLength: 1000 }
        instance: { type: [string, 'null'], maxLength: 500 }
        requestId: { type: string, maxLength: 100 }
        versionConflict: { $ref: '#/components/schemas/VersionConflictDetails' }
        fieldErrors:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [field, code]
            properties:
              field: { type: string, maxLength: 200 }
              code: { type: string, maxLength: 80 }
              message: { type: [string, 'null'], maxLength: 500 }
    EmailChallengeRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        deviceId:
          type: string
          minLength: 1
          maxLength: 200
          description: 可选防滥用信号；缺失时按来源 IP 与 MISSING_DEVICE 域标记计算设备限流摘要。
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, verificationCode, password, nickname, timezone, baseCurrency, locale]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        verificationCode: { type: string, pattern: '^[0-9]{6}$' }
        password: { type: string, minLength: 10, maxLength: 128, writeOnly: true }
        nickname: { type: string, minLength: 1, maxLength: 100 }
        timezone: { type: string, minLength: 1, maxLength: 64, default: Asia/Shanghai }
        baseCurrency: { $ref: '#/components/schemas/Currency' }
        locale: { type: string, minLength: 2, maxLength: 16 }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password, deviceName]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 1, maxLength: 128, writeOnly: true }
        deviceName:
          type: string
          minLength: 1
          maxLength: 100
          description: 经 NFKC 与 trim 规范化的展示设备名称。
        deviceId:
          type: [string, 'null']
          maxLength: 200
          description: 可空客户端不透明稳定设备标识；非空时为 1～200 字符且不得全空白，保留客户端原值，不做 NFKC 或 trim。
    MobileRefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 32
          maxLength: 500
          writeOnly: true
          description: 仅客户端持有一次的刷新凭据；V1 签发值为 rt1_ 加 32 字节 SecureRandom 的无填充 Base64URL，服务端不保存原文并在每次成功刷新后轮换。
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email, challengeCode, newPassword]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        challengeCode: { type: string, pattern: '^[0-9]{6}$' }
        newPassword: { type: string, minLength: 10, maxLength: 128, writeOnly: true }
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 128, writeOnly: true }
        newPassword: { type: string, minLength: 10, maxLength: 128, writeOnly: true }
    UpdateUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        nickname: { type: string, minLength: 1, maxLength: 100 }
        timezone: { type: string, minLength: 1, maxLength: 64 }
        baseCurrency: { $ref: '#/components/schemas/Currency' }
        locale: { type: string, minLength: 2, maxLength: 16 }
        amountFormat: { type: string, enum: [STANDARD, ACCOUNTING] }
    CreateAccountRequest:
      type: object
      additionalProperties: false
      required: [accountClass, accountType, name, currency]
      description: 可选 openingBalance 只能在本次原子账户创建中生成内部 OPENING 交易；其 businessDate/timezone 由 businessAt 按当前用户 IANA 时区派生并固化。缺失或 null 不创建交易；存在时必须为账户币种精度内的正数。
      properties:
        accountClass: { type: string, enum: [ASSET, LIABILITY, INVESTMENT] }
        accountType: { type: string, enum: [BANK, WECHAT, ALIPAY, CASH, BROKERAGE, FUND, CREDIT_CARD, LOAN, CONSUMER_LOAN, OTHER] }
        name: { type: string, minLength: 1, maxLength: 100 }
        currency: { $ref: '#/components/schemas/Currency' }
        institution: { type: [string, 'null'], maxLength: 120 }
        note: { type: [string, 'null'], maxLength: 2000 }
        openingBalance:

  responses:
    BadRequest: { description: 请求格式或字段校验失败, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Unauthenticated: { description: 未认证或会话失效, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    InvalidCredentials: { description: 邮箱不存在、密码错误、LOCKED 或 CLOSED 统一返回 INVALID_CREDENTIALS，不泄露账号存在、状态或密码 Hash 信息, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Forbidden: { description: 无对象权限或 CSRF 校验失败, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    NotFound: { description: 资源不存在或对当前用户不可见, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Conflict: { description: 幂等键异参、处理中、版本冲突或唯一约束冲突；仅 code=VERSION_CONFLICT 时返回完整 versionConflict，资源不可见时按 404 返回；处理中时 Retry-After 固定为 5 秒, headers: { Retry-After: { description: 仅 IDEMPOTENCY_REQUEST_IN_PROGRESS 返回的重试等待秒数, schema: { type: integer, const: 5 } } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    BusinessRuleViolation: { description: 业务规则不允许本次操作, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    RateLimited: { description: 请求过于频繁；Retry-After 为所有超限窗口中的最长剩余秒数, headers: { Retry-After: { description: 所有超限窗口中的最长剩余时间（秒）, schema: { type: integer, minimum: 1 } } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    PayloadTooLarge: { description: 文件超过 V1 上传上限, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    UnsupportedMediaType: { description: 不支持的文件类型, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    ChallengeAccepted:
      description: 若符合发送规则则已接受
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data, meta]
            properties:
              data:
                type: object
                additionalProperties: false
                required: [expiresIn]
                properties: { expiresIn: { type: integer, minimum: 1 } }
              meta: { $ref: '#/components/schemas/ResponseMeta' }
    UserCreated: { description: 用户已创建, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/UserEnvelope' } } } }
    UserOk: { description: 用户资料, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/UserEnvelope' } } } }
    WebSessionCreated: { description: Web 会话已创建；刷新 Token 仅在 HttpOnly Cookie 中返回, content: { application/json: { schema: { $ref: '#/components/schemas/WebSessionEnvelope' } } } }
    WebSessionRefreshed: { description: Web 会话已轮换, content: { application/json: { schema: { $ref: '#/components/schemas/WebSessionEnvelope' } } } }
    MobileSessionCreated: { description: Mobile 会话与刷新 Token 已创建, content: { application/json: { schema: { $ref: '#/components/schemas/MobileSessionEnvelope' } } } }
    MobileSessionRefreshed: { description: Mobile 刷新 Token 已轮换, content: { application/json: { schema: { $ref: '#/components/schemas/MobileSessionEnvelope' } } } }
    SessionListOk: { description: 设备会话列表, content: { application/json: { schema: { $ref: '#/components/schemas/SessionListEnvelope' } } } }
    AccountCreated: { description: 账户、OWNER membership、计入设置和科目已原子创建, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/AccountCreatedEnvelope' } } } }
    AccountOk: { description: 账户详情, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/AccountEnvelope' } } } }
    AccountListOk: { description: 账户列表, content: { application/json: { schema: { $ref: '#/components/schemas/AccountListEnvelope' } } } }
    AccountBalanceOk: { description: 账户账面及可用余额, content: { application/json: { schema: { $ref: '#/components/schemas/AccountBalanceEnvelope' } } } }
    BalanceHistoryOk: { description: 账户历史余额, content: { application/json: { schema: { $ref: '#/components/schemas/BalanceHistoryEnvelope' } } } }
    LiquidityHoldCreated: { description: 流动性占用修订已创建, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/LiquidityHoldEnvelope' } } } }
    LiquidityHoldOk: { description: 流动性占用, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/LiquidityHoldEnvelope' } } } }
    LiquidityHoldListOk: { description: 流动性占用列表, content: { application/json: { schema: { $ref: '#/components/schemas/LiquidityHoldListEnvelope' } } } }
    TransactionCreated: { description: 交易和不可变分录已创建, headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/TransactionEnvelope' } } } }

# Ziji V1 machine-readable API contract. Keep operationId values stable because they are part of the idempotency scope.
openapi: 3.1.0
info:
  title: 资迹 Ziji API
  version: 0.1.0
  description: V1 正式 API 契约，对应 PRD V0.1、RTM V0.1 和《API 契约》V0.1；96 个 HTTP operationId 为正式实施基线。
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
    description: 当前主版本
security:
  - bearerAuth: []
tags:
  - { name: Auth, description: 注册、登录和设备会话 }
  - { name: Users, description: 当前用户、导出和注销 }
  - { name: Accounts, description: 账户、余额和流动性占用 }
  - { name: Ledger, description: 交易、冲正和余额调整 }
  - { name: Categories, description: 分类和标签 }
  - { name: Sharing, description: 成员、邀请和个人计入设置 }
  - { name: Imports, description: 账单文件导入 }
  - { name: Investments, description: 产品、行情、持仓和收益 }
  - { name: Statistics, description: Dashboard 和统计 }
  - { name: ExchangeRates, description: 汇率 }
  - { name: Recurring, description: 周期账单 }
  - { name: Sync, description: 移动端增量同步 }
paths:
  /auth/registration-challenges:
    post:
      tags: [Auth]
      operationId: createRegistrationChallenge
      summary: 发送注册邮箱验证码
      security: []
      x-requirement-ids: [AUTH-001, SEC-002]
      requestBody: { $ref: '#/components/requestBodies/EmailChallengeRequest' }
      responses:
        '202': { $ref: '#/components/responses/ChallengeAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/register:
    post:
      tags: [Auth]
      operationId: registerUser
      summary: 验证邮箱验证码并注册
      security: []
      x-requirement-ids: [AUTH-001]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/RegisterRequest' } }
      responses:
        '201': { $ref: '#/components/responses/UserCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /auth/web/sessions:
    post:
      tags: [Auth]
      operationId: createWebSession
      summary: Web 邮箱密码登录
      security: []
      x-requirement-ids: [AUTH-002, AUTH-007]
      requestBody: { $ref: '#/components/requestBodies/LoginRequest' }
      responses:
        '201': { $ref: '#/components/responses/WebSessionCreated' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/web/sessions/refresh:
    post:
      tags: [Auth]
      operationId: refreshWebSession
      summary: 使用 HttpOnly Cookie 轮换 Web 会话
      security:
        - webRefreshCookie: []
      x-requirement-ids: [AUTH-002, AUTH-007, SEC-001]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '200': { $ref: '#/components/responses/WebSessionRefreshed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/mobile/sessions:
    post:
      tags: [Auth]
      operationId: createMobileSession
      summary: Mobile 邮箱密码登录
      security: []
      x-requirement-ids: [AUTH-002, AUTH-007]
      requestBody: { $ref: '#/components/requestBodies/LoginRequest' }
      responses:
        '201': { $ref: '#/components/responses/MobileSessionCreated' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/mobile/sessions/refresh:
    post:
      tags: [Auth]
      operationId: refreshMobileSession
      summary: 轮换 Mobile 刷新 Token
      security: []
      x-requirement-ids: [AUTH-002, AUTH-007, SEC-001]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/MobileRefreshRequest' } }
      responses:
        '200': { $ref: '#/components/responses/MobileSessionRefreshed' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /auth/sessions/current:
    delete:
      tags: [Auth]
      operationId: revokeCurrentSession
      summary: 退出当前设备
      x-requirement-ids: [AUTH-004]
      responses:
        '204': { description: 当前设备会话已撤销 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/password-reset-challenges:
    post:
      tags: [Auth]
      operationId: createPasswordResetChallenge
      summary: 发送密码重置验证码
      security: []
      x-requirement-ids: [AUTH-003, SEC-002]
      requestBody: { $ref: '#/components/requestBodies/EmailChallengeRequest' }
      responses:
        '202': { $ref: '#/components/responses/ChallengeAccepted' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/password-reset:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: 重置密码并撤销既有会话
      security: []
      x-requirement-ids: [AUTH-003]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/PasswordResetRequest' } }
      responses:
        '204': { description: 密码已重置 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /users/me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      summary: 查询当前用户
      x-requirement-ids: [AUTH-006]
      responses:
        '200': { $ref: '#/components/responses/UserOk' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Users]
      operationId: updateCurrentUser
      summary: 修改当前用户设置
      x-requirement-ids: [AUTH-006, DATA-005, FX-006]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/merge-patch+json: { schema: { $ref: '#/components/schemas/UpdateUserRequest' } }
      responses:
        '200': { $ref: '#/components/responses/UserOk' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /users/me/password-change:
    post:
      tags: [Users]
      operationId: changePassword
      summary: 使用当前密码修改密码
      x-requirement-ids: [AUTH-003]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/PasswordChangeRequest' } }
      responses:
        '204': { description: 密码已修改 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /users/me/sessions:
    get:
      tags: [Users]
      operationId: listUserSessions
      summary: 查询设备会话
      x-requirement-ids: [AUTH-004]
      parameters: [{ $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' }]
      responses:
        '200': { $ref: '#/components/responses/SessionListOk' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Users]
      operationId: revokeAllUserSessions
      summary: 撤销全部设备会话
      x-requirement-ids: [AUTH-004]
      responses:
        '204': { description: 全部设备会话已撤销 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /users/me/sessions/{sessionId}:
    parameters: [{ $ref: '#/components/parameters/SessionId' }]
    delete:
      tags: [Users]
      operationId: revokeUserSession
      summary: 撤销指定设备会话
      x-requirement-ids: [AUTH-004]
      responses:
        '204': { description: 设备会话已撤销 }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /accounts:
    get:
      tags: [Accounts]
      operationId: listAccounts
      summary: 查询当前用户可见账户
      x-requirement-ids: [ACC-001, SHR-002]
      parameters: [{ $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' }]
      responses:
        '200': { $ref: '#/components/responses/AccountListOk' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Accounts]
      operationId: createAccount
      summary: 原子创建账户、OWNER、计入设置、科目及可选期初余额
      x-requirement-ids: [ACC-001, ACC-002, ACC-003, ACC-010]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CreateAccountRequest' } }
      responses:
        '201': { $ref: '#/components/responses/AccountCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /accounts/{accountId}:
    parameters: [{ $ref: '#/components/parameters/AccountId' }]
    get:
      tags: [Accounts]
      operationId: getAccount
      summary: 查询账户详情
      x-requirement-ids: [ACC-002, ACC-004]
      responses:
        '200': { $ref: '#/components/responses/AccountOk' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Accounts]
      operationId: updateAccount
      summary: OWNER 修改账户资料
      x-requirement-ids: [ACC-002, SHR-002]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/merge-patch+json: { schema: { $ref: '#/components/schemas/UpdateAccountRequest' } }
      responses:
        '200': { $ref: '#/components/responses/AccountOk' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /accounts/{accountId}/archive:
    parameters: [{ $ref: '#/components/parameters/AccountId' }]
    post:
      tags: [Accounts]
      operationId: archiveAccount
      summary: 归档账户
      x-requirement-ids: [ACC-006, ACC-007]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ArchiveAccountRequest' } }
      responses:
        '200': { $ref: '#/components/responses/AccountOk' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /accounts/{accountId}/balance:
    parameters: [{ $ref: '#/components/parameters/AccountId' }]
    get:
      tags: [Accounts]
      operationId: getAccountBalance
      summary: 查询指定时点账面和可用余额
      x-requirement-ids: [ACC-004, ACC-009]
      parameters: [{ $ref: '#/components/parameters/AsOf' }]
      responses:
        '200': { $ref: '#/components/responses/AccountBalanceOk' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /accounts/{accountId}/balance-history:
    parameters: [{ $ref: '#/components/parameters/AccountId' }]
    get:
      tags: [Accounts]
      operationId: listAccountBalanceHistory
      summary: 查询账户历史余额
      x-requirement-ids: [DASH-006, DASH-007]
      parameters: [{ $ref: '#/components/parameters/DateFrom' }, { $ref: '#/components/parameters/DateTo' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' }]
      responses:
        '200': { $ref: '#/components/responses/BalanceHistoryOk' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /accounts/{accountId}/liquidity-holds:
    parameters: [{ $ref: '#/components/parameters/AccountId' }]
    get:
      tags: [Accounts]
      operationId: listLiquidityHolds
      summary: 查询流动性占用
      x-requirement-ids: [ACC-009]
      parameters: [{ $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' }]
      responses:
        '200': { $ref: '#/components/responses/LiquidityHoldListOk' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Accounts]
      operationId: createLiquidityHold
      summary: 创建流动性占用
      x-requirement-ids: [ACC-009]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CreateLiquidityHoldRequest' } }
      responses:
        '201': { $ref: '#/components/responses/LiquidityHoldCreated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /accounts/{accountId}/liquidity-holds/{holdId}/revisions:
    parameters: [{ $ref: '#/components/parameters/AccountId' }, { $ref: '#/components/parameters/HoldId' }]
    post:
      tags: [Accounts]
      operationId: reviseLiquidityHold
      summary: 关闭旧占用并创建修订
      x-requirement-ids: [ACC-009]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ReviseLiquidityHoldRequest' } }
      responses:
        '201': { $ref: '#/components/responses/LiquidityHoldCreated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /accounts/{accountId}/liquidity-holds/{holdId}/release:
    parameters: [{ $ref: '#/components/parameters/AccountId' }, { $ref: '#/components/parameters/HoldId' }]
    post:
      tags: [Accounts]
      operationId: releaseLiquidityHold
      summary: 释放流动性占用
      x-requirement-ids: [ACC-009]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' }]
      responses:
        '200': { $ref: '#/components/responses/LiquidityHoldOk' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /transactions:
    get:
      tags: [Ledger]
      operationId: listTransactions
      summary: 查询流水
      x-requirement-ids: [LED-001, LED-011]
      parameters: [{ $ref: '#/components/parameters/AccountIdQuery' }, { $ref: '#/components/parameters/DateFrom' }, { $ref: '#/components/parameters/DateTo' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' }]
      responses:
        '200': { $ref: '#/components/responses/TransactionListOk' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Ledger]
      operationId: postTransaction
      summary: 创建并确认交易
      x-requirement-ids: [LED-001, LED-003, LED-004, LED-005, LED-006, LED-007, LED-008, LIA-002, LIA-003, LIA-004]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/PostTransactionRequest' } }
      responses:
        '201': { $ref: '#/components/responses/TransactionCreated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /transactions/{transactionId}:
    parameters: [{ $ref: '#/components/parameters/TransactionId' }]
    get:
      tags: [Ledger]
      operationId: getTransaction
      summary: 查询交易、分录和版本关系
      x-requirement-ids: [LED-001, LED-011]
      responses:
        '200': { $ref: '#/components/responses/TransactionOk' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /transactions/{transactionId}/revisions:
    parameters: [{ $ref: '#/components/parameters/TransactionId' }]
    post:
      tags: [Ledger]
      operationId: reviseTransaction
      summary: 冲正旧版本并创建新版本
      x-requirement-ids: [LED-009]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ReviseTransactionRequest' } }
      responses:
        '201': { $ref: '#/components/responses/TransactionCreated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /transactions/{transactionId}/reversal:
    parameters: [{ $ref: '#/components/parameters/TransactionId' }]
    post:
      tags: [Ledger]
      operationId: reverseTransaction
      summary: 作废并冲正交易
      x-requirement-ids: [LED-010]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ReasonRequest' } }
      responses:
        '201': { $ref: '#/components/responses/TransactionCreated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /accounts/{accountId}/balance-adjustments:
    parameters: [{ $ref: '#/components/parameters/AccountId' }]
    post:
      tags: [Ledger]
      operationId: createBalanceAdjustment
      summary: 创建余额调整
      x-requirement-ids: [ACC-005]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/BalanceAdjustmentRequest' } }
      responses:
        '201': { $ref: '#/components/responses/TransactionCreated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /categories:
    get:
      tags: [Categories]
      operationId: listCategories
      summary: 查询默认、个人和账户分类
      x-requirement-ids: [CAT-001]
      parameters: [{ $ref: '#/components/parameters/AccountIdQuery' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' }]
      responses:
        '200': { $ref: '#/components/responses/CategoryListOk' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Categories]
      operationId: createCategory
      summary: 创建分类
      x-requirement-ids: [CAT-001, CAT-002]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CreateCategoryRequest' } }
      responses:
        '201': { $ref: '#/components/responses/CategoryCreated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /categories/{categoryId}:
    parameters: [{ $ref: '#/components/parameters/CategoryId' }]
    patch:
      tags: [Categories]
      operationId: updateCategory
      summary: 修改或停用分类
      x-requirement-ids: [CAT-002, CAT-003]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/merge-patch+json: { schema: { $ref: '#/components/schemas/UpdateCategoryRequest' } }
      responses:
        '200': { $ref: '#/components/responses/CategoryOk' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /categories/{categoryId}/merge:
    parameters: [{ $ref: '#/components/parameters/CategoryId' }]
    post:
      tags: [Categories]
      operationId: mergeCategory
      summary: 合并分类并保留历史映射
      x-requirement-ids: [CAT-003]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/MergeCategoryRequest' } }
      responses:
        '200': { $ref: '#/components/responses/CategoryOk' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /tags:
    get:
      tags: [Categories]
      operationId: listTags
      summary: 查询标签
      x-requirement-ids: [CAT-004]
      parameters: [{ $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' }]
      responses:
        '200': { $ref: '#/components/responses/TagListOk' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Categories]
      operationId: createTag
      summary: 创建标签
      x-requirement-ids: [CAT-004]

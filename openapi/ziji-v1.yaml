      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        accountClass: { type: string, enum: [ASSET, LIABILITY, INVESTMENT] }
        accountType: { type: string, enum: [BANK, WECHAT, ALIPAY, CASH, BROKERAGE, CREDIT_CARD, LOAN, OTHER] }
        currency: { $ref: '#/components/schemas/Currency' }
        institution: { type: [string, 'null'] }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
        currentUserRole: { type: string, enum: [OWNER, EDITOR, VIEWER] }
        inclusionRatio: { $ref: '#/components/schemas/Ratio' }
        version: { type: integer, minimum: 1 }
    AccountBalance:
      type: object
      additionalProperties: false
      required: [accountId, currency, ledgerBalance, unavailableAmount, unavailableBreakdown, availableBalance, liquidityStatus, asOf, asOfSequence]
      properties:
        accountId: { type: string, format: uuid }
        currency: { $ref: '#/components/schemas/Currency' }
        ledgerBalance: { $ref: '#/components/schemas/Money' }
        unavailableAmount: { $ref: '#/components/schemas/NonNegativeMoney' }
        unavailableBreakdown:
          type: object
          additionalProperties: false
          required: [frozen, inTransit, reserved]
          properties:
            frozen: { $ref: '#/components/schemas/NonNegativeMoney' }
            inTransit: { $ref: '#/components/schemas/NonNegativeMoney' }
            reserved: { $ref: '#/components/schemas/NonNegativeMoney' }
        availableBalance: { $ref: '#/components/schemas/Money' }
        liquidityStatus: { type: string, enum: [NORMAL, NEGATIVE_AVAILABLE, STALE] }
        asOf: { type: string, format: date-time }
        asOfSequence: { type: integer, minimum: 0 }
    BalancePoint:
      type: object
      additionalProperties: false
      required: [businessDate, balance, currency]
      properties:
        businessDate: { type: string, format: date }
        balance: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/Currency' }
    LiquidityHold:
      type: object
      additionalProperties: false
      required: [id, accountId, rootHoldId, revisionNo, amount, status, effectiveAt, reason, version]
      properties:
        id: { type: string, format: uuid }

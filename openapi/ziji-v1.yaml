        businessDate: { type: string, format: date }
        balance: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/Currency' }
    LiquidityHold:
      type: object
      additionalProperties: false
      description: 公共响应同时暴露可审计的 LiquidityHold 事实；source、createdBy、createdAt、updatedAt、releasedAt、endedAt 和 endReason 均来自不可变/追加式业务事实，不允许客户端写入。
      x-audit-mapping:
        source: { responseField: source, databaseColumn: source, publicWriteValue: MANUAL, clientWritable: false }
        reason: { responseField: reason, databaseColumn: note, clientWritable: true }
        createdBy: { responseField: createdBy, databaseColumn: created_by, clientWritable: false }
        supersedesId: { responseField: supersedesId, databaseColumn: previous_revision_id, clientWritable: false }
        releasedAt: { responseField: releasedAt, databaseColumn: released_at, clientWritable: false }
        endedAt: { responseField: endedAt, databaseColumn: ended_at, clientWritable: false }
        endReason: { responseField: endReason, databaseColumn: end_reason, clientWritable: false }
        revisionAudit: { action: LIQUIDITY_HOLD_REVISED, reasonSource: NEW_VERSION_REASON_AND_DATABASE_NOTE }
      x-lifecycle:
        asOf: REQUEST_EVALUATION_TIME
        validWhen: effective_at <= asOf AND (ended_at IS NULL OR ended_at > asOf) AND (expires_at IS NULL OR expires_at > asOf)
        statuses:
          PENDING: effective_at > asOf and not terminally ended
          ACTIVE: effective_at <= asOf and validWhen
          RELEASED: end_reason = RELEASED
          SUPERSEDED: end_reason = SUPERSEDED
          EXPIRED: end_reason = EXPIRED or (expires_at <= asOf and no terminal end reason)
        expiry: logical expiry wins before finalization; finalizer materializes ended_at=expires_at and end_reason=EXPIRED
        concurrency: first serialized terminal transition wins; stale If-Match returns VERSION_CONFLICT and a current expired record returns BUSINESS_RULE_VIOLATION
      required: [id, accountId, rootHoldId, supersedesId, revisionNo, type, amount, currency, status, effectiveAt, expiresAt, source, reason, createdBy, createdAt, updatedAt, releasedAt, endedAt, endReason, version]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        rootHoldId: { type: string, format: uuid }
        supersedesId: { type: [string, 'null'], format: uuid }
        revisionNo: { type: integer, minimum: 1 }
        type: { type: string, enum: [FROZEN, IN_TRANSIT, RESERVED] }
        amount: { $ref: '#/components/schemas/PositiveMoney' }
        currency: { $ref: '#/components/schemas/Currency' }
        status: { type: string, enum: [PENDING, ACTIVE, RELEASED, SUPERSEDED, EXPIRED] }
        effectiveAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        source: { type: string, enum: [MANUAL, IMPORT, SYSTEM] }
        reason: { type: [string, 'null'], maxLength: 500 }
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        releasedAt: { type: [string, 'null'], format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
        endReason: { type: [string, 'null'], enum: [RELEASED, SUPERSEDED, EXPIRED, null] }
        version: { type: integer, minimum: 1 }

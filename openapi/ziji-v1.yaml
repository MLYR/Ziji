        summary:
          type: object
          additionalProperties: false
          required: [totalAssets, availableFunds, investmentAssets, totalLiabilities, netAssets]
          properties:
            totalAssets: { $ref: '#/components/schemas/Money' }
            availableFunds: { $ref: '#/components/schemas/Money' }
            investmentAssets: { $ref: '#/components/schemas/Money' }
            totalLiabilities: { $ref: '#/components/schemas/Money' }
            netAssets: { $ref: '#/components/schemas/Money' }
        changeAttribution:
          type: object
          additionalProperties: false
          required: [income, expense, market, fx, adjustment, inclusion]
          properties:
            income: { $ref: '#/components/schemas/Money' }
            expense: { $ref: '#/components/schemas/Money' }
            market: { $ref: '#/components/schemas/Money' }
            fx: { $ref: '#/components/schemas/Money' }
            adjustment: { $ref: '#/components/schemas/Money' }
            inclusion: { $ref: '#/components/schemas/Money' }
        distribution: { type: array, items: { $ref: '#/components/schemas/DistributionItem' } }
        investmentOverview: { $ref: '#/components/schemas/InvestmentOverview' }
        dataQualityWarnings: { type: array, items: { $ref: '#/components/schemas/DataQualityWarning' } }
    DistributionItem:
      type: object
      additionalProperties: false
      required: [key, label, amount, ratio]
      properties:
        key: { type: string, maxLength: 100 }
        label: { type: string, maxLength: 200 }
        amount: { $ref: '#/components/schemas/Money' }
        ratio: { $ref: '#/components/schemas/Ratio' }
    DataQualityWarning:
      type: object
      additionalProperties: false
      required: [code, affectedCount]
      properties:
        code: { type: string, enum: [UNPRICED_INSTRUMENTS, MISSING_EXCHANGE_RATES, STALE_MARKET_DATA] }
        affectedCount: { type: integer, minimum: 1 }
    StatisticsPoint:
      type: object
      additionalProperties: false
      required: [businessDate, values]
      properties:
        businessDate: { type: string, format: date }
        values:
          type: object
          minProperties: 1
          maxProperties: 30
          additionalProperties: { $ref: '#/components/schemas/Money' }
    RecurringRule:
      type: object
      additionalProperties: false
      required: [id, accountId, transactionTemplate, frequency, intervalValue, startsOn, nextOccurrenceOn, status, version]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        transactionTemplate: { $ref: '#/components/schemas/TransactionTemplate' }
        frequency: { type: string, enum: [DAILY, WEEKLY, MONTHLY, YEARLY] }
        intervalValue: { type: integer, minimum: 1 }
        startsOn: { type: string, format: date }
        endsOn: { type: [string, 'null'], format: date }
        nextOccurrenceOn: { type: string, format: date }
        status: { type: string, enum: [ACTIVE, PAUSED, ENDED] }
        version: { type: integer, minimum: 1 }
    RecurringOccurrence:
      type: object
      additionalProperties: false
      required: [id, ruleId, scheduledDate, status]
      properties:
        id: { type: string, format: uuid }
        ruleId: { type: string, format: uuid }
        scheduledDate: { type: string, format: date }
        status: { type: string, enum: [PENDING_CONFIRMATION, CONFIRMED, SKIPPED, EXPIRED] }
        transactionId: { type: [string, 'null'], format: uuid }
    AsyncJob:
      type: object
      additionalProperties: false
      required: [id, type, status, progress, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [IMPORT_PARSE, IMPORT_CONFIRM, DATA_EXPORT, STATISTICS_REBUILD] }
        status: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELED] }
        progress:
          type: object
          additionalProperties: false
          required: [completed]
          properties:
            completed: { type: integer, minimum: 0 }
            total: { type: [integer, 'null'], minimum: 0 }
        error:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, maxLength: 80 }
                message: { type: [string, 'null'], maxLength: 500 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DataExport:
      type: object
      additionalProperties: false
      required: [id, jobId, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        jobId: { type: string, format: uuid }
        status: { type: string, enum: [QUEUED, GENERATING, READY, FAILED, EXPIRED] }
        downloadUrl: { type: [string, 'null'], format: uri }
        expiresAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AccountClosure:
      type: object
      additionalProperties: false
      required: [id, status, requestedAt, coolingOffUntil, blockers, version]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [COOLING_OFF, APPROVED, CANCELED, COMPLETED, BLOCKED] }
        requestedAt: { type: string, format: date-time }
        coolingOffUntil: { type: string, format: date-time }
        blockers:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, resourceId]
            properties:
              code: { type: string, enum: [SOLE_ACCOUNT_OWNER, EXPORT_IN_PROGRESS, SHARED_ACCOUNT_REVIEW] }
              resourceId: { type: [string, 'null'], format: uuid }
        version: { type: integer, minimum: 1 }
    SyncChange:
      type: object
      additionalProperties: false
      required: [sequence, entityType, entityId, entityVersion, changeType, payloadVersion]
      properties:
        sequence: { type: integer, minimum: 1 }
        entityType: { type: string, maxLength: 40 }
        entityId: { type: string, format: uuid }
        entityVersion: { type: integer, minimum: 1 }
        changeType: { type: string, enum: [UPSERT, TOMBSTONE, ACCESS_REVOKED, BOOTSTRAP] }
        payloadVersion: { type: integer, const: 1 }
        payload:
          type: object
          maxProperties: 100
          additionalProperties: { $ref: '#/components/schemas/SyncPayloadValue' }
    SyncPayloadValue:
      oneOf:
        - { type: string, maxLength: 5000 }
        - { type: number }
        - { type: integer }
        - { type: boolean }
        - { type: 'null' }
        - type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/SyncPayloadValue' }
        - type: object
          maxProperties: 100
          additionalProperties: { $ref: '#/components/schemas/SyncPayloadValue' }
    SyncOperationResult:
      oneOf:
        - { $ref: '#/components/schemas/SyncAppliedOperationResult' }
        - { $ref: '#/components/schemas/SyncDuplicateOperationResult' }
        - { $ref: '#/components/schemas/SyncConflictOperationResult' }
        - { $ref: '#/components/schemas/SyncRejectedOperationResult' }
        - { $ref: '#/components/schemas/SyncRetryableOperationResult' }
    SyncAppliedOperationResult:
      type: object
      additionalProperties: false
      required: [operationId, status, entityId, entityVersion]
      properties:
        operationId: { type: string, format: uuid }
        status: { type: string, const: APPLIED }
        entityId: { type: string, format: uuid }
        entityVersion: { type: integer, minimum: 1 }
    SyncDuplicateOperationResult:
      oneOf:
        - { $ref: '#/components/schemas/SyncDuplicateAppliedOperationResult' }
        - { $ref: '#/components/schemas/SyncDuplicateFailedOperationResult' }
    SyncDuplicateAppliedOperationResult:
      type: object
      additionalProperties: false
      required: [operationId, status, entityId, entityVersion]
      properties:
        operationId: { type: string, format: uuid }
        status: { type: string, const: DUPLICATE }
        entityId: { type: string, format: uuid, description: 首次安全结果包含资源时重放该 ID。 }
        entityVersion: { type: integer, minimum: 1, description: 首次安全结果包含资源时重放该版本。 }
    SyncDuplicateFailedOperationResult:
      type: object
      additionalProperties: false
      required: [operationId, status, error]
      properties:
        operationId: { type: string, format: uuid }
        status: { type: string, const: DUPLICATE }
        error:
          oneOf:
            - { $ref: '#/components/schemas/SyncConflictProblem' }
            - { $ref: '#/components/schemas/SyncRejectedProblem' }
    SyncConflictProblem:
      allOf:
        - { $ref: '#/components/schemas/Problem' }
        - type: object
          required: [code, status, versionConflict]
          properties:
            code: { type: string, const: VERSION_CONFLICT }
            status: { type: integer, const: 409 }
            versionConflict: { $ref: '#/components/schemas/VersionConflictDetails' }
    SyncConflictOperationResult:
      type: object
      additionalProperties: false
      required: [operationId, status, error]
      properties:
        operationId: { type: string, format: uuid }
        status: { type: string, const: CONFLICT }
        error: { $ref: '#/components/schemas/SyncConflictProblem' }
    SyncRejectedOperationResult:
      type: object
      additionalProperties: false
      required: [operationId, status, error]
      properties:
        operationId: { type: string, format: uuid }
        status: { type: string, const: REJECTED }
        error: { $ref: '#/components/schemas/SyncRejectedProblem' }
    SyncRejectedProblem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, requestId]
      properties:
        type: { type: string, format: uri }
        title: { type: string, maxLength: 200 }
        status: { type: integer, minimum: 400, maximum: 599 }
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,79}$'
          not: { const: VERSION_CONFLICT }
        detail: { type: [string, 'null'], maxLength: 1000 }
        instance: { type: [string, 'null'], maxLength: 500 }
        requestId: { type: string, maxLength: 100 }
        fieldErrors:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [field, code]
            properties:
              field: { type: string, maxLength: 200 }
              code: { type: string, maxLength: 80 }
              message: { type: [string, 'null'], maxLength: 500 }
    SyncRetryableOperationResult:
      type: object
      additionalProperties: false
      required: [operationId, status, error, retryAfterSeconds]
      properties:
        operationId: { type: string, format: uuid }
        status: { type: string, const: RETRYABLE }
        error: { $ref: '#/components/schemas/SyncRetryableProblem' }
        retryAfterSeconds: { type: integer, const: 5 }
    SyncRetryableProblem:
      oneOf:
        - { $ref: '#/components/schemas/SyncRetryableInProgressProblem' }
        - { $ref: '#/components/schemas/SyncRetryableInternalErrorProblem' }
    SyncRetryableProblemBase:
      type: object
      additionalProperties: false
      required: [type, title, status, code, requestId]
      properties:
        type: { type: string, format: uri }
        title: { type: string, maxLength: 200 }
        status: { type: integer, minimum: 400, maximum: 599 }
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,79}$' }
        detail: { type: [string, 'null'], maxLength: 1000 }
        instance: { type: [string, 'null'], maxLength: 500 }
        requestId: { type: string, maxLength: 100 }
        fieldErrors:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [field, code]
            properties:
              field: { type: string, maxLength: 200 }
              code: { type: string, maxLength: 80 }
              message: { type: [string, 'null'], maxLength: 500 }
    SyncRetryableInProgressProblem:
      allOf:
        - { $ref: '#/components/schemas/SyncRetryableProblemBase' }
        - type: object
          properties:
            status: { type: integer, const: 409 }
            code: { type: string, const: IDEMPOTENCY_REQUEST_IN_PROGRESS }
    SyncRetryableInternalErrorProblem:
      allOf:
        - { $ref: '#/components/schemas/SyncRetryableProblemBase' }
        - type: object
          properties:
            status: { type: integer, const: 500 }
            code: { type: string, const: INTERNAL_ERROR }

    # Envelope schemas keep success responses uniform and fully bounded.
    UserEnvelope: { $ref: '#/components/schemas/UserDataEnvelope' }
    UserDataEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties: { data: { $ref: '#/components/schemas/User' }, meta: { $ref: '#/components/schemas/ResponseMeta' } }
    WebSessionEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [session, accessToken, expiresIn]
          properties:
            session: { $ref: '#/components/schemas/Session' }
            accessToken:
              type: string
              minLength: 20
              description: RS256 access JWT；固定最长 30 分钟，不写入服务端持久化或日志。
            expiresIn: { type: integer, minimum: 1, description: Access Token 有效秒数，最长 30 分钟。 }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    MobileSessionEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [session, tokens]
          properties: { session: { $ref: '#/components/schemas/Session' }, tokens: { $ref: '#/components/schemas/TokenPair' } }
        meta: { $ref: '#/components/schemas/ResponseMeta' }
    SessionListEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties: { data: { type: array, items: { $ref: '#/components/schemas/Session' } }, meta: { $ref: '#/components/schemas/PageMeta' } }
    AccountEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties: { data: { $ref: '#/components/schemas/Account' }, meta: { $ref: '#/components/schemas/ResponseMeta' } }
    LiabilityDetailEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties: { data: { $ref: '#/components/schemas/LiabilityDetail' }, meta: { $ref: '#/components/schemas/ResponseMeta' } }
    AccountCreatedEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [account, openingTransactionId]

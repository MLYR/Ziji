        loanDate: { type: [string, 'null'], format: date }
        dueDate: { type: [string, 'null'], format: date }
        billingDay: { type: [integer, 'null'], minimum: 1, maximum: 31 }
        repaymentDay: { type: [integer, 'null'], minimum: 1, maximum: 31 }

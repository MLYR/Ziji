      parameters: [{ $ref: '#/components/parameters/AsOf' }]
      responses:
        '200': { $ref: '#/components/responses/DashboardOk' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /statistics/assets:
    get:
      tags: [Statistics]
      operationId: getAssetStatistics
      summary: 查询资产和净资产趋势
      x-requirement-ids: [DASH-006, DASH-007, DASH-009]
      parameters:
        - { $ref: '#/components/parameters/DateFrom' }
        - { $ref: '#/components/parameters/DateTo' }
        - { $ref: '#/components/parameters/Granularity' }
      responses:
        '200': { $ref: '#/components/responses/StatisticsSeriesOk' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /asset-changes/calendar:
    get:
      tags: [Statistics]
      operationId: getAssetChangeCalendar
      summary: 查询总资产或净资产的月度每日变化
      x-requirement-ids: [DASH-010]
      parameters:
        - { $ref: '#/components/parameters/CalendarMonth' }
        - { $ref: '#/components/parameters/AssetChangeMetric' }
      responses:
        '200': { $ref: '#/components/responses/AssetChangeCalendarOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /asset-changes/calendar/{businessDate}/details:
    parameters: [{ $ref: '#/components/parameters/BusinessDate' }]
    get:
      tags: [Statistics]
      operationId: getAssetChangeDayDetails
      summary: 查询选中日期的总资产和净资产变化明细
      x-requirement-ids: [DASH-010]
      responses:
        '200': { $ref: '#/components/responses/AssetChangeDayDetailsOk' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /statistics/cash-flow:
    get:
      tags: [Statistics]
      operationId: getCashFlowStatistics
      summary: 查询收支和净现金流趋势
      x-requirement-ids: [DASH-003, DASH-006]
      parameters:
        - { $ref: '#/components/parameters/DateFrom' }
        - { $ref: '#/components/parameters/DateTo' }
        - { $ref: '#/components/parameters/Granularity' }
      responses:
        '200': { $ref: '#/components/responses/StatisticsSeriesOk' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /statistics/accounts:
    get:
      tags: [Statistics]
      operationId: getAccountStatistics
      summary: 查询账户余额和占比趋势
      x-requirement-ids: [DASH-006, DASH-007]
      parameters:
        - { $ref: '#/components/parameters/DateFrom' }
        - { $ref: '#/components/parameters/DateTo' }
        - { $ref: '#/components/parameters/Granularity' }
      responses:
        '200': { $ref: '#/components/responses/StatisticsSeriesOk' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

        '403': { $ref: '#/components/responses/Forbidden' }
  /exchange-rates:
    get:
      tags: [ExchangeRates]
      operationId: listExchangeRates
      summary: 查询当前或历史汇率
      x-requirement-ids: [FX-003, FX-004]
      parameters:
        - { $ref: '#/components/parameters/BaseCurrency' }
        - { $ref: '#/components/parameters/QuoteCurrency' }
        - { $ref: '#/components/parameters/DateFrom' }
        - { $ref: '#/components/parameters/DateTo' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200': { $ref: '#/components/responses/ExchangeRateListOk' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /exchange-rates/manual:
    post:
      tags: [ExchangeRates]
      operationId: createManualExchangeRate
      summary: 创建手工汇率
      x-requirement-ids: [FX-005]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CreateExchangeRateRequest' } }
      responses:
        '201': { $ref: '#/components/responses/ExchangeRateCreated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /exchange-rates/{rateId}/corrections:
    parameters: [{ $ref: '#/components/parameters/RateId' }]
    post:
      tags: [ExchangeRates]
      operationId: correctExchangeRate
      summary: 创建汇率修订
      x-requirement-ids: [FX-005]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CorrectExchangeRateRequest' } }
      responses:
        '201': { $ref: '#/components/responses/ExchangeRateCreated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /exchange-rates/status:
    get:
      tags: [ExchangeRates]
      operationId: getExchangeRateStatus
      summary: 查询汇率数据新鲜度
      x-requirement-ids: [FX-004]
      responses:
        '200': { $ref: '#/components/responses/ExchangeRateStatusOk' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

        '403': { $ref: '#/components/responses/Forbidden' }
  /recurring-rules:
    get:
      tags: [Recurring]
      operationId: listRecurringRules
      summary: 查询周期规则
      x-requirement-ids: [REC-001]
      parameters: [{ $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' }]
      responses:
        '200': { $ref: '#/components/responses/RecurringRuleListOk' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Recurring]
      operationId: createRecurringRule
      summary: 创建周期规则
      x-requirement-ids: [REC-001]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CreateRecurringRuleRequest' } }
      responses:
        '201': { $ref: '#/components/responses/RecurringRuleCreated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /recurring-rules/{ruleId}:
    parameters: [{ $ref: '#/components/parameters/RuleId' }]
    patch:
      tags: [Recurring]
      operationId: updateRecurringRule
      summary: 修改、暂停或结束周期规则
      x-requirement-ids: [REC-001]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/merge-patch+json: { schema: { $ref: '#/components/schemas/UpdateRecurringRuleRequest' } }
      responses:
        '200': { $ref: '#/components/responses/RecurringRuleOk' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /recurring-occurrences:
    get:
      tags: [Recurring]
      operationId: listRecurringOccurrences
      summary: 查询待确认发生项
      x-requirement-ids: [REC-002]
      parameters: [{ $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' }]
      responses:
        '200': { $ref: '#/components/responses/RecurringOccurrenceListOk' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /recurring-occurrences/{occurrenceId}/confirm:
    parameters: [{ $ref: '#/components/parameters/OccurrenceId' }]
    post:
      tags: [Recurring]
      operationId: confirmRecurringOccurrence
      summary: 确认发生项并生成交易
      x-requirement-ids: [REC-002]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '201': { $ref: '#/components/responses/TransactionCreated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /recurring-occurrences/{occurrenceId}/skip:
    parameters: [{ $ref: '#/components/parameters/OccurrenceId' }]
    post:
      tags: [Recurring]
      operationId: skipRecurringOccurrence
      summary: 跳过本次发生项
      x-requirement-ids: [REC-002]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: 已跳过 }
        '409': { $ref: '#/components/responses/Conflict' }

        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  # Data export is a download workflow. V1 uploads exist only for bill import.
  /users/me/exports:
    post:
      tags: [Users]
      operationId: createDataExport
      summary: 创建用户数据导出任务
      x-requirement-ids: [SEC-007]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '202': { $ref: '#/components/responses/DataExportAccepted' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /users/me/exports/{exportId}:
    parameters: [{ $ref: '#/components/parameters/ExportId' }]
    get:
      tags: [Users]
      operationId: getDataExport
      summary: 查询数据导出任务和短时下载地址
      x-requirement-ids: [SEC-007]
      responses:
        '200': { $ref: '#/components/responses/DataExportOk' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /users/me/account-closure:
    get:
      tags: [Users]
      operationId: getAccountClosure
      summary: 查询注销申请状态和影响
      x-requirement-ids: [SEC-007]
      responses:
        '200': { $ref: '#/components/responses/AccountClosureOk' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Users]
      operationId: createAccountClosure
      summary: 发起账号注销申请
      x-requirement-ids: [SEC-007]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '202': { $ref: '#/components/responses/AccountClosureAccepted' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/BusinessRuleViolation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Users]
      operationId: cancelAccountClosure
      summary: 冷静期内撤销注销申请
      x-requirement-ids: [SEC-007]
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses:
        '204': { description: 注销申请已撤销, headers: { ETag: { description: 注销申请的新版本, schema: { type: string } } } }
        '409': { $ref: '#/components/responses/Conflict' }

        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  # Sync payloads reuse the same domain command schemas and still enforce current object permissions.
  /sync/changes:
    get:
      tags: [Sync]
      operationId: listSyncChanges
      summary: 按定向游标拉取增量变更
      x-requirement-ids: [SYNC-001, SYNC-003, SYNC-010]
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { $ref: '#/components/responses/SyncChangeListOk' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /sync/operations:
    post:
      tags: [Sync]
      operationId: applySyncOperations
      summary: 按顺序应用离线操作
      x-requirement-ids: [SYNC-002, SYNC-004, SYNC-010]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ApplySyncOperationsRequest' } }
      responses:
        '200': { $ref: '#/components/responses/SyncOperationResultsOk' }
        '400': { $ref: '#/components/responses/BadRequest' }

        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /async-jobs/{jobId}:
    parameters: [{ $ref: '#/components/parameters/JobId' }]
    get:
      tags: [Users]
      operationId: getAsyncJob
      summary: 查询当前用户可见的异步任务
      responses:
        '200': { $ref: '#/components/responses/AsyncJobOk' }
        '404': { $ref: '#/components/responses/NotFound' }

        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    webRefreshCookie:
      type: apiKey
      in: cookie
      name: ziji_refresh
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 认证写操作按当前用户，公开注册/密码重置按版本化匿名主体，与 API 主版本和 operationId 共同形成作用域；同键异参返回冲突。
      schema: { type: string, minLength: 16, maxLength: 100 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 资源 ETag，例如双引号包围的实体版本。
      schema: { type: string, minLength: 3, maxLength: 80 }
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 200 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 500 }
    DateFrom:
      name: dateFrom
      in: query
      required: false
      schema: { type: string, format: date }
    DateTo:
      name: dateTo
      in: query
      required: false
      schema: { type: string, format: date }
    AsOf:
      name: asOf
      in: query
      required: false
      schema: { type: string, format: date-time }
    CalendarMonth:
      name: month
      in: query
      required: true
      description: 用户时区下的自然月。
      schema: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
    InvestmentReturnScopeType:
      name: scopeType
      in: query
      required: true
      schema: { type: string, enum: [PORTFOLIO, INSTRUMENT] }
    AssetChangeMetric:
      name: metric
      in: query
      required: true
      description: 资产规模指标；变化率不是投资收益率。
      schema: { type: string, enum: [TOTAL_ASSETS, NET_ASSETS] }
    InstrumentIdQuery:
      name: instrumentId
      in: query
      required: false
      description: scopeType=INSTRUMENT 时必填，PORTFOLIO 时禁止。
      schema: { type: string, format: uuid }
    AccountIdQuery:
      name: accountId
      in: query
      required: false
      schema: { type: string, format: uuid }
    BaseCurrency:
      name: baseCurrency
      in: query
      required: true
      schema: { $ref: '#/components/schemas/Currency' }
    QuoteCurrency:
      name: quoteCurrency
      in: query
      required: true
      schema: { $ref: '#/components/schemas/Currency' }
    Granularity:
      name: granularity
      in: query
      required: false
      schema: { type: string, enum: [DAY, WEEK, MONTH, YEAR], default: DAY }
    SearchQuery:
      name: q
      in: query
      required: true
      schema: { type: string, minLength: 1, maxLength: 100 }
    AccountId: { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
    BatchId: { name: batchId, in: path, required: true, schema: { type: string, format: uuid } }
    CategoryId: { name: categoryId, in: path, required: true, schema: { type: string, format: uuid } }
    ExportId: { name: exportId, in: path, required: true, schema: { type: string, format: uuid } }
    HoldId: { name: holdId, in: path, required: true, schema: { type: string, format: uuid } }
    InstrumentId: { name: instrumentId, in: path, required: true, schema: { type: string, format: uuid } }
    BusinessDate: { name: businessDate, in: path, required: true, schema: { type: string, format: date } }
    InvitationId: { name: invitationId, in: path, required: true, schema: { type: string, format: uuid } }
    InvitationToken: { name: token, in: path, required: true, schema: { type: string, minLength: 24, maxLength: 300 } }
    JobId: { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
    MemberId: { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
    OccurrenceId: { name: occurrenceId, in: path, required: true, schema: { type: string, format: uuid } }
    RateId: { name: rateId, in: path, required: true, schema: { type: string, format: uuid } }
    RowId: { name: rowId, in: path, required: true, schema: { type: string, format: uuid } }
    RuleId: { name: ruleId, in: path, required: true, schema: { type: string, format: uuid } }
    SessionId: { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
    TagId: { name: tagId, in: path, required: true, schema: { type: string, format: uuid } }
    TransactionId: { name: transactionId, in: path, required: true, schema: { type: string, format: uuid } }

  requestBodies:
    EmailChallengeRequest:
      required: true
      content:
        application/json: { schema: { $ref: '#/components/schemas/EmailChallengeRequest' } }
    LoginRequest:
      required: true
      content:
        application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } }

  schemas:
    # Financial values are decimal strings so JSON binary floating point never changes facts.
    # 普通客户端只提交语义命令；LedgerEntry 仅出现在只读响应，禁止作为写请求字段。
    Money:
      description: API 金额字符串最多 2 位小数；JPY 由同一对象的 currency 进一步限制为 0 位。
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,21})(\.[0-9]{1,2})?$'
    NonNegativeMoney:
      description: 非负 API 金额字符串；JPY 由同一对象的 currency 进一步限制为 0 位。
      type: string
      pattern: '^(0|[1-9][0-9]{0,21})(\.[0-9]{1,2})?$'
    PositiveMoney:
      description: 正 API 金额字符串；JPY 由同一对象的 currency 进一步限制为 0 位。
      type: string
      pattern: '^(0*[1-9][0-9]{0,21})(\.[0-9]{1,2})?$|^0\.(0[1-9]|[1-9][0-9]?)$'
    PostedMoney:
      description: 已按关联 currency 校验最小单位的入账金额；CNY/USD/HKD/EUR 最多 2 位，JPY 不允许小数。
      oneOf:
        - { type: string, pattern: '^-?(0|[1-9][0-9]{0,21})(\.[0-9]{1,2})?$' }
        - { type: string, pattern: '^-?(0|[1-9][0-9]{0,21})$' }
    NonNegativePostedMoney:
      description: 非负入账金额，实际小数位由同一对象的 currency 决定。
      oneOf:
        - { type: string, pattern: '^(0|[1-9][0-9]{0,21})(\.[0-9]{1,2})?$' }
        - { type: string, pattern: '^(0|[1-9][0-9]{0,21})$' }
    PositivePostedMoney:
      description: 正入账金额，实际小数位由同一对象的 currency 决定。
      oneOf:
        - { type: string, pattern: '^(0*[1-9][0-9]{0,21})(\.[0-9]{1,2})?$|^0\.(0[1-9]|[1-9][0-9]?)$' }
        - { type: string, pattern: '^[1-9][0-9]{0,21}$' }
    NonNegativeCnyMoney: { type: string, pattern: '^(0|[1-9][0-9]{0,21})(\.[0-9]{1,2})?$' }
    NonNegativeJpyMoney: { type: string, pattern: '^(0|[1-9][0-9]{0,21})$' }
    Quantity: { type: string, pattern: '^-?(0|[1-9][0-9]{0,27})(\.[0-9]{1,12})?$' }
    PositiveQuantity: { type: string, pattern: '^(0*[1-9][0-9]{0,27})(\.[0-9]{1,12})?$|^0\.[0-9]*[1-9][0-9]{0,11}$' }
    Rate: { type: string, pattern: '^(0*[1-9][0-9]{0,27})(\.[0-9]{1,12})?$|^0\.[0-9]*[1-9][0-9]{0,11}$' }
    Ratio: { type: string, pattern: '^(0|[1-9][0-9]{0,2})(\.[0-9]{1,6})?$' }
    Currency: { type: string, pattern: '^[A-Z]{3}$', examples: [CNY] }
    PageMeta:
      type: object
      additionalProperties: false
      required: [requestId, hasMore]
      properties:
        requestId: { type: string, minLength: 1, maxLength: 100 }
        nextCursor: { type: [string, 'null'], maxLength: 500 }
        hasMore: { type: boolean }
    ResponseMeta:
      type: object
      additionalProperties: false
      required: [requestId]
      properties: { requestId: { type: string, minLength: 1, maxLength: 100 } }
    VersionConflictDetails:
      type: object
      additionalProperties: false
      required: [currentVersion, currentEtag, resourceLocation]
      properties:
        currentVersion: { type: integer, minimum: 1, description: 当前可见资源版本号 }
        currentEtag:
          type: string
          minLength: 3
          maxLength: 82
          pattern: '^"[1-9][0-9]*"$'
          description: 双引号包围的当前资源版本，例如 "7"。
        resourceLocation:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '^/(?!/)[^\s]*$'
          description: 以单个斜杠开头的相对 API 地址；不得以 // 开头。
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, requestId]
      properties:
        type: { type: string, format: uri }
        title: { type: string, maxLength: 200 }
        status: { type: integer, minimum: 400, maximum: 599 }
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,79}$' }
        detail: { type: [string, 'null'], maxLength: 1000 }
        instance: { type: [string, 'null'], maxLength: 500 }
        requestId: { type: string, maxLength: 100 }
        versionConflict: { $ref: '#/components/schemas/VersionConflictDetails' }
        fieldErrors:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [field, code]
            properties:
              field: { type: string, maxLength: 200 }
              code: { type: string, maxLength: 80 }
              message: { type: [string, 'null'], maxLength: 500 }
    EmailChallengeRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        deviceId:
          type: string
          minLength: 1
          maxLength: 200
          description: 可选防滥用信号；缺失时按来源 IP 与 MISSING_DEVICE 域标记计算设备限流摘要。
    RegisterRequest:

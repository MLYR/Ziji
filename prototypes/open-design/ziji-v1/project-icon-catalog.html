<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="资迹 Ziji 项目实际使用的 Lucide 图标目录与独立 SVG 下载入口。">
  <title>资迹 Ziji · 项目图标目录</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: oklch(0.1696 0.0187 289.34);
      --surface: oklch(0.2018 0.0198 289.07);
      --surface-2: oklch(0.2338 0.0249 287.83);
      --surface-hover: oklch(0.2631 0.0241 288.14);
      --fg: oklch(0.9997 0.0013 106.42);
      --muted: oklch(0.7400 0.0302 281.31);
      --muted-strong: oklch(0.82 0.025 281.31);
      --border: oklch(0.3107 0.0269 281.72);
      --accent: oklch(0.7459 0.1800 56.64);
      --accent-ink: oklch(0.1696 0.0187 289.34);
      --focus: oklch(0.7459 0.1800 56.64);
      --font-display: "HarmonyOS Sans SC", "PingFang SC", "Noto Sans SC", sans-serif;
      --font-body: "PingFang SC", "HarmonyOS Sans SC", "Noto Sans SC", sans-serif;
      --font-mono: "Geist Mono", "SFMono-Regular", Consolas, monospace;
    }
    [data-theme="light"] {
      color-scheme: light;
      --bg: oklch(0.9997 0.0013 106.42);
      --surface: oklch(0.9770 0.0040 286.33);
      --surface-2: oklch(0.9536 0.0067 286.27);
      --surface-hover: oklch(0.928 0.009 286);
      --fg: oklch(0.1696 0.0187 289.34);
      --muted: oklch(0.46 0.032 282);
      --muted-strong: oklch(0.35 0.035 282);
      --border: oklch(0.9007 0.0109 291.93);
      --focus: oklch(0.49 0.15 48);
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body { margin: 0; min-width: 320px; min-height: 100dvh; background: var(--bg); color: var(--fg); font: 15px/1.7 var(--font-body); }
    button, input { font: inherit; }
    button, a { touch-action: manipulation; }
    a { color: inherit; text-decoration: none; }
    /* 外链 SVG 的 currentColor 不继承宿主文字色，深色主题在预览层统一反相为冷白。 */
    [data-theme="dark"] img[src^="assets/icons/"] { filter: invert(1); }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    .catalog-shell { width: min(100%, 1440px); margin: 0 auto; padding: clamp(24px, 4vw, 56px); }
    .catalog-header { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 32px; padding-bottom: 28px; border-bottom: 1px solid var(--border); }
    .brand { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; }
    .brand-mark { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font: 600 16px/1 var(--font-display); }
    .brand strong { font: 600 16px/1 var(--font-display); }
    .eyebrow { margin: 22px 0 0; color: var(--muted-strong); font-size: 12px; letter-spacing: .02em; }
    h1 { max-width: 16ch; margin: 7px 0 0; font: 600 clamp(32px, 4.5vw, 56px)/1.34 var(--font-display); letter-spacing: 0; text-wrap: balance; }
    .lead { max-width: 65ch; margin: 13px 0 0; color: var(--muted-strong); font-size: 16px; line-height: 1.75; }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .button { min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--fg); cursor: pointer; font-weight: 550; letter-spacing: .02em; transition: background 160ms ease, border-color 160ms ease, transform 160ms ease; }
    .button:hover { background: var(--surface-hover); border-color: var(--muted); color: var(--fg); }
    .button:active { transform: translateY(1px); }
    .button-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    .button-primary:hover { background: color-mix(in oklch, var(--accent), white 12%); border-color: color-mix(in oklch, var(--accent), white 12%); color: var(--accent-ink); }
    .icon-only { width: 44px; padding: 0; }
    .icon-only img, .button img { width: 18px; height: 18px; }
    .catalog-summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 20px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .summary-item { min-width: 0; padding: 17px 18px; border-right: 1px solid var(--border); background: var(--surface); }
    .summary-item:last-child { border-right: 0; }
    .summary-item span { display: block; color: var(--muted); font-size: 12px; letter-spacing: .02em; }
    .summary-item strong { display: block; margin-top: 5px; font: 600 16px/1.4 var(--font-mono); }
    .catalog-tools { position: sticky; top: 0; z-index: 10; display: grid; grid-template-columns: minmax(220px, 1fr) auto; gap: 12px; margin-top: 20px; padding: 12px; border: 1px solid var(--border); border-radius: 12px; background: color-mix(in oklch, var(--bg) 88%, transparent); backdrop-filter: blur(14px); }
    .search-wrap { position: relative; }
    .search-wrap img { position: absolute; left: 13px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); opacity: .8; }
    .search { width: 100%; min-height: 44px; padding: 0 14px 0 42px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--fg); }
    .search::placeholder { color: var(--muted); }
    .filter-group { display: flex; gap: 6px; overflow-x: auto; }
    .filter { min-height: 44px; padding: 0 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--muted-strong); white-space: nowrap; cursor: pointer; }
    .filter:hover { background: var(--surface-hover); color: var(--fg); }
    .filter[aria-pressed="true"] { background: var(--surface-2); border-color: var(--muted); color: var(--fg); }
    .catalog-main { margin-top: 28px; }
    .category { margin-top: 34px; }
    .category:first-child { margin-top: 0; }
    .category-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 11px; }
    .category h2 { margin: 0; font: 600 21px/1.4 var(--font-display); letter-spacing: 0; }
    .category-count { color: var(--muted); font: 12px/1.5 var(--font-mono); }
    .icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); border: 1px solid var(--border); border-radius: 12px; background: var(--border); gap: 1px; overflow: hidden; }
    .icon-card { position: relative; min-width: 0; min-height: 156px; display: grid; grid-template-rows: 1fr auto; padding: 16px; border: 0; background: var(--surface); color: var(--fg); text-align: left; cursor: pointer; transition: background 160ms ease; }
    .icon-card:hover { background: var(--surface-hover); color: var(--fg); }
    .icon-preview { display: grid; place-items: center; min-height: 80px; }
    .icon-preview img { width: 34px; height: 34px; color: var(--fg); }
    .icon-meta { min-width: 0; }
    .icon-name { display: block; overflow-wrap: anywhere; font: 550 12px/1.45 var(--font-mono); }
    .icon-component { display: block; margin-top: 3px; overflow-wrap: anywhere; color: var(--muted); font: 10px/1.5 var(--font-mono); }
    .download-mark { position: absolute; top: 12px; right: 12px; width: 16px; height: 16px; opacity: .5; }
    .icon-card:hover .download-mark { opacity: 1; }
    .empty { display: none; min-height: 260px; place-items: center; padding: 32px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); text-align: center; }
    .empty img { width: 32px; height: 32px; margin: 0 auto 12px; opacity: .7; }
    .empty h2 { margin: 0; font: 600 18px/1.5 var(--font-display); }
    .empty p { margin: 5px 0 0; color: var(--muted); }
    .toast { position: fixed; right: 20px; bottom: 20px; z-index: 20; min-width: min(320px, calc(100vw - 40px)); padding: 13px 15px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-hover); color: var(--fg); box-shadow: 0 16px 48px oklch(0.08 0.02 289 / .3); transform: translateY(16px); opacity: 0; pointer-events: none; transition: opacity 160ms ease, transform 160ms ease; }
    .toast.open { transform: translateY(0); opacity: 1; }
    .catalog-footer { display: flex; justify-content: space-between; gap: 16px; margin-top: 38px; padding-top: 18px; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; }
    @media (max-width: 820px) {
      .catalog-shell { padding: 24px 14px 36px; }
      .catalog-header { grid-template-columns: 1fr; align-items: start; gap: 20px; }
      .header-actions { flex-wrap: wrap; }
      .catalog-summary { grid-template-columns: repeat(2, 1fr); }
      .summary-item:nth-child(2) { border-right: 0; }
      .summary-item:nth-child(-n+2) { border-bottom: 1px solid var(--border); }
      .catalog-tools { grid-template-columns: 1fr; top: 0; }
      .icon-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .catalog-footer { flex-direction: column; }
    }
    @media (max-width: 390px) {
      h1 { font-size: 31px; }
      .lead { font-size: 15px; }
      .catalog-summary { grid-template-columns: 1fr; }
      .summary-item { border-right: 0; border-bottom: 1px solid var(--border); }
      .summary-item:last-child { border-bottom: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .001ms !important; }
    }
  </style>
</head>
<body>
  <main class="catalog-shell" data-od-id="project-icon-catalog">
    <header class="catalog-header" data-od-id="catalog-header">
      <div>
        <a class="brand" href="index.html" data-od-id="back-to-launcher"><span class="brand-mark">Z</span><strong>资迹 Ziji</strong></a>
        <p class="eyebrow">设计系统 · 项目资源</p>
        <h1 data-od-id="catalog-title">项目图标目录</h1>
        <p class="lead">汇总项目中实际使用的 Lucide 图标。每个图标已提取为独立 SVG，保留 24px 视口、1.7px 圆角描边与 currentColor 着色方式。</p>
      </div>
      <div class="header-actions" aria-label="目录操作">
        <a class="button button-primary" href="assets/icons/manifest.json" download data-od-id="download-manifest">下载 JSON 清单</a>
        <button class="button icon-only" type="button" id="theme-toggle" aria-label="切换深浅主题" data-od-id="theme-toggle"><img src="assets/icons/sun.svg" alt=""></button>
      </div>
    </header>

    <section class="catalog-summary" aria-label="图标系统摘要" data-od-id="catalog-summary">
      <div class="summary-item"><span>图标数量</span><strong id="icon-total">—</strong></div>
      <div class="summary-item"><span>来源</span><strong>Lucide 0.468.0</strong></div>
      <div class="summary-item"><span>视口</span><strong>24 × 24 px</strong></div>
      <div class="summary-item"><span>描边</span><strong>1.7 px · round</strong></div>
    </section>

    <section class="catalog-tools" aria-label="图标筛选" data-od-id="catalog-tools">
      <label class="search-wrap" for="icon-search"><img src="assets/icons/search.svg" alt=""><input class="search" id="icon-search" type="search" autocomplete="off" placeholder="搜索图标名称或 Lucide 组件名"></label>
      <div class="filter-group" id="filter-group" aria-label="按类别筛选"></div>
    </section>

    <div class="catalog-main" id="catalog-content" data-od-id="catalog-content"></div>
    <section class="empty" id="empty-state" aria-live="polite" data-od-id="empty-state"><div><img src="assets/icons/search.svg" alt=""><h2>没有匹配的图标</h2><p>尝试缩短关键词或切换到“全部”。</p></div></section>

    <footer class="catalog-footer"><span>点击任意图标即可下载对应 SVG。</span><span>项目内没有使用 Emoji 或自绘填充图标。</span></footer>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="assets/icons/manifest.js"></script>
  <script>
    /* 图标目录交互保持本地可用：搜索、分类筛选、主题切换和独立 SVG 下载均无需服务端。 */
    (function () {
      const manifest = window.ZIJI_ICON_MANIFEST;
      const content = document.getElementById("catalog-content");
      const filters = document.getElementById("filter-group");
      const search = document.getElementById("icon-search");
      const empty = document.getElementById("empty-state");
      const total = document.getElementById("icon-total");
      const toast = document.getElementById("toast");
      const categories = ["全部", ...new Set(manifest.icons.map(icon => icon.category))];
      let activeCategory = "全部";
      let toastTimer;

      total.textContent = String(manifest.count).padStart(2, "0");
      filters.innerHTML = categories.map((category, index) => `<button class="filter" type="button" data-category="${category}" aria-pressed="${index === 0}" data-od-id="filter-${index}">${category}</button>`).join("");

      function showToast(message) {
        clearTimeout(toastTimer);
        toast.textContent = message;
        toast.classList.add("open");
        toastTimer = setTimeout(() => toast.classList.remove("open"), 2200);
      }

      function download(icon) {
        const link = document.createElement("a");
        link.href = icon.file;
        link.download = `${icon.name}.svg`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        showToast(`已下载 ${icon.name}.svg`);
      }

      function render() {
        const query = search.value.trim().toLowerCase();
        const visible = manifest.icons.filter(icon => (activeCategory === "全部" || icon.category === activeCategory) && (!query || `${icon.name} ${icon.component}`.toLowerCase().includes(query)));
        const groups = categories.slice(1).map(category => ({ category, icons: visible.filter(icon => icon.category === category) })).filter(group => group.icons.length);
        content.innerHTML = groups.map((group, groupIndex) => `<section class="category" data-od-id="category-${groupIndex}"><div class="category-head"><h2>${group.category}</h2><span class="category-count">${String(group.icons.length).padStart(2, "0")} 个</span></div><div class="icon-grid">${group.icons.map((icon, iconIndex) => `<button class="icon-card" type="button" data-icon="${icon.name}" aria-label="下载 ${icon.name} SVG" data-od-id="icon-${groupIndex}-${iconIndex}"><span class="icon-preview"><img src="${icon.file}" alt=""></span><span class="icon-meta"><strong class="icon-name">${icon.name}</strong><span class="icon-component">${icon.component}</span></span><img class="download-mark" src="assets/icons/download.svg" alt=""></button>`).join("")}</div></section>`).join("");
        empty.style.display = visible.length ? "none" : "grid";
        content.hidden = !visible.length;
      }

      filters.addEventListener("click", event => {
        const button = event.target.closest("[data-category]");
        if (!button) return;
        activeCategory = button.dataset.category;
        filters.querySelectorAll("button").forEach(item => item.setAttribute("aria-pressed", String(item === button)));
        render();
      });
      search.addEventListener("input", render);
      content.addEventListener("click", event => {
        const card = event.target.closest("[data-icon]");
        if (!card) return;
        const icon = manifest.icons.find(item => item.name === card.dataset.icon);
        if (icon) download(icon);
      });
      document.getElementById("theme-toggle").addEventListener("click", event => {
        const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = next;
        event.currentTarget.querySelector("img").src = `assets/icons/${next === "dark" ? "sun" : "moon"}.svg`;
      });
      render();
    })();
  </script>
</body>
</html>

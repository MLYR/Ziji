# Testcontainers 动态注入数据源连接；test profile 只固定迁移和外部适配器行为。
spring.flyway.clean-disabled=true
spring.mail.host=localhost
spring.mail.port=1025
ziji.storage.endpoint=http://localhost:9000
ziji.storage.access-key=test
ziji.storage.secret-key=test-secret
ziji.storage.bucket=ziji-test
# 仅用于 test profile 的固定测试密钥；staging/production 必须从外部密钥配置注入。
ziji.auth.hmac.current-key-version=2
ziji.auth.hmac.current-key-base64=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
ziji.auth.hmac.previous-key-version=1
ziji.auth.hmac.previous-key-base64=ZmVkY2JhOTg3NjU0MzIxMGZlZGNiYTk4NzY1NDMyMTA=
ziji.auth.hmac.previous-key-retention=48h
ziji.auth.envelope.kek-version=1
ziji.auth.envelope.kek-base64=NPnXQXmmCujQI2nSLwp4cylzClFocUl3fJ6G2nl90WU=
# 仅供 test profile 使用的固定 RSA 测试夹具；绝不可复制到 local、staging 或 production。
ziji.auth.access-token.current-kid=test-rs256-current-1
ziji.auth.access-token.current-private-key-pkcs8-
ziji.auth.access-token.current-public-key-x509-

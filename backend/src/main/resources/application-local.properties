# local profile 只连接 compose 内的开发服务，不保存任何生产凭据。
spring.datasource.url=${ZIJI_DB_URL:jdbc:postgresql://localhost:5432/ziji}
spring.datasource.username=${ZIJI_DB_USER:ziji}
spring.datasource.password=${ZIJI_DB_PASSWORD:ziji-local}
spring.mail.host=${ZIJI_MAIL_HOST:localhost}
spring.mail.port=${ZIJI_MAIL_PORT:1025}
ziji.storage.endpoint=${ZIJI_STORAGE_ENDPOINT:http://localhost:9000}
ziji.storage.access-key=${ZIJI_STORAGE_ACCESS_KEY:ziji-local}
ziji.storage.secret-key=${ZIJI_STORAGE_SECRET_KEY:ziji-local-secret}
ziji.storage.bucket=${ZIJI_STORAGE_BUCKET:ziji-imports}
# 账户列表游标使用专用 AES-256-GCM 密钥；不得复用认证、幂等或 outbox 密钥。
ziji.account.cursor-key-base64=${ZIJI_ACCOUNT_CURSOR_KEY_BASE64}
# HMAC 当前密钥和 outbox KEK 必须由启动环境注入；仓库不提供可复用默认密钥。
ziji.auth.hmac.current-key-version=${ZIJI_AUTH_HMAC_CURRENT_KEY_VERSION}
ziji.auth.hmac.current-key-base64=${ZIJI_AUTH_HMAC_CURRENT_KEY_BASE64}
ziji.auth.hmac.previous-key-version=${ZIJI_AUTH_HMAC_PREVIOUS_KEY_VERSION:}
ziji.auth.hmac.previous-key-base64=${ZIJI_AUTH_HMAC_PREVIOUS_KEY_BASE64:}
ziji.auth.hmac.previous-key-retention=${ZIJI_AUTH_HMAC_PREVIOUS_KEY_RETENTION:48h}
# 公开写接口匿名幂等 HMAC 独立于限流密钥；部署环境必须成对提供上一版本并至少保留 7 天。
ziji.auth.idempotency.current-key-version=${ZIJI_AUTH_IDEMPOTENCY_CURRENT_KEY_VERSION}
ziji.auth.idempotency.current-key-base64=${ZIJI_AUTH_IDEMPOTENCY_CURRENT_KEY_BASE64}
ziji.auth.idempotency.previous-key-version=${ZIJI_AUTH_IDEMPOTENCY_PREVIOUS_KEY_VERSION:}
ziji.auth.idempotency.previous-key-base64=${ZIJI_AUTH_IDEMPOTENCY_PREVIOUS_KEY_BASE64:}
ziji.auth.idempotency.previous-key-retention=${ZIJI_AUTH_IDEMPOTENCY_PREVIOUS_KEY_RETENTION:168h}
ziji.auth.envelope.kek-version=${ZIJI_AUTH_ENVELOPE_KEK_VERSION}
ziji.auth.envelope.kek-base64=${ZIJI_AUTH_ENVELOPE_KEK_BASE64}
ziji.auth.trusted-proxy-addresses=${ZIJI_AUTH_TRUSTED_PROXY_ADDRESSES:}
# Access Token RSA 密钥只从启动环境注入；BE-AUTH-004 绑定并校验，仓库不提供 local 默认私钥或公钥。
ziji.auth.access-token.current-kid=${ZIJI_AUTH_ACCESS_TOKEN_CURRENT_KID}
ziji.auth.access-token.current-private-key-pkcs8-base64=${ZIJI_AUTH_ACCESS_TOKEN_CURRENT_PRIVATE_KEY_PKCS8_BASE64}
ziji.auth.access-token.current-public-key-x509-base64=${ZIJI_AUTH_ACCESS_TOKEN_CURRENT_PUBLIC_KEY_X509_BASE64}
ziji.auth.access-token.previous-kid=${ZIJI_AUTH_ACCESS_TOKEN_PREVIOUS_KID:}
ziji.auth.access-token.previous-public-key-x509-base64=${ZIJI_AUTH_ACCESS_TOKEN_PREVIOUS_PUBLIC_KEY_X509_BASE64:}
ziji.auth.access-token.previous-public-key-retention=${ZIJI_AUTH_ACCESS_TOKEN_PREVIOUS_PUBLIC_KEY_RETENTION:24h}

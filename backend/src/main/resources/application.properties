spring.application.name=ziji-backend
# 本地开发是默认 profile；部署环境必须显式指定 staging 或 production。
spring.profiles.default=local
# 认证由 auth 模块实现，骨架阶段不创建带随机密码的临时用户。
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
spring.flyway.locations=classpath:db/migration
spring.jooq.sql-dialect=POSTGRES
management.endpoints.web.exposure.include=health,info,modulith
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
# 控制台按 ECS JSON 输出，并自动携带 MDC 中的 requestId。
logging.structured.format.console=ecs
# 多实例通过 PostgreSQL advisory lock 协调；测试 profile 会显式关闭后台线程。
ziji.liquidity-hold.expiry-finalizer.enabled=true
ziji.liquidity-hold.expiry-finalizer.initial-delay=PT1M
ziji.liquidity-hold.expiry-finalizer.fixed-delay=PT1M
ziji.liquidity-hold.expiry-finalizer.stale-run-after=PT15M
ziji.liquidity-hold.expiry-finalizer.lock-timeout=PT5S
ziji.liquidity-hold.expiry-finalizer.batch-size=100

# 验证码邮件 outbox 消费者；测试 profile 必须显式关闭，避免后台线程连接开发用 Mailpit。
ziji.email-delivery.enabled=true
ziji.email-delivery.initial-delay=PT2S
ziji.email-delivery.fixed-delay=PT2S

# 同花顺公开数据源（CHG-MD-001）：无 key、无官方授权与 SLA，只拉取本地已有 THS 映射的产品。
# sync.enabled=false 时不注册调度器；cron 按交易日低频配置（默认工作日 17:30，收盘数据稳定后）。
ziji.ths.sync.enabled=false
ziji.ths.sync.cron=0 30 17 * * MON-FRI
# 每日供应商调用上限，跨实例共享；单产品最小间隔限流另行由进程内闸门约束。
ziji.ths.daily-quota=2000
ziji.ths.timeout-ms=3000
ziji.ths.max-retries=2

spring.application.name=ziji-backend
# 本地开发是默认 profile；部署环境必须显式指定 staging 或 production。
spring.profiles.default=local
# 认证由 auth 模块实现，骨架阶段不创建带随机密码的临时用户。
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
spring.flyway.locations=classpath:db/migration
spring.jooq.sql-dialect=POSTGRES
management.endpoints.web.exposure.include=health,info,modulith
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
# 控制台按 ECS JSON 输出，并自动携带 MDC 中的 requestId。
logging.structured.format.console=ecs
# 多实例通过 PostgreSQL advisory lock 协调；测试 profile 会显式关闭后台线程。
ziji.liquidity-hold.expiry-finalizer.enabled=true
ziji.liquidity-hold.expiry-finalizer.initial-delay=PT1M
ziji.liquidity-hold.expiry-finalizer.fixed-delay=PT1M
ziji.liquidity-hold.expiry-finalizer.stale-run-after=PT15M
ziji.liquidity-hold.expiry-finalizer.lock-timeout=PT5S
ziji.liquidity-hold.expiry-finalizer.batch-size=100

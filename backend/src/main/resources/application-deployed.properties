# staging/production 共用的部署约束：所有外部连接和凭据必须由环境注入，不提供本地默认值。
spring.datasource.url=${ZIJI_DB_URL}
spring.datasource.username=${ZIJI_DB_USER}
spring.datasource.password=${ZIJI_DB_PASSWORD}
spring.mail.host=${ZIJI_MAIL_HOST}
spring.mail.port=${ZIJI_MAIL_PORT}
ziji.storage.endpoint=${ZIJI_STORAGE_ENDPOINT}
ziji.storage.access-key=${ZIJI_STORAGE_ACCESS_KEY}
ziji.storage.secret-key=${ZIJI_STORAGE_SECRET_KEY}
ziji.storage.bucket=${ZIJI_STORAGE_BUCKET}

name: CI

on:
  # PR 是进入 main 前唯一自动完整门禁；合并后不重复执行同一套检查，手动排查仍可触发。
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支只保留最新流水线，减少过时检查占用执行资源。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect change risk
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.detect.outputs.backend }}
      backend_deep: ${{ steps.detect.outputs.backend_deep }}
      web: ${{ steps.detect.outputs.web }}
      mobile: ${{ steps.detect.outputs.mobile }}
      api: ${{ steps.detect.outputs.api }}
      migration: ${{ steps.detect.outputs.migration }}
      security_deep: ${{ steps.detect.outputs.security_deep }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect affected areas
        id: detect
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/detect-change-risk.mjs
      # 所有风险输出都必须是严格布尔字符串，避免单个消费者把异常值解释成“不适用”。
      - name: Validate change-risk outputs
        env:
          BACKEND: ${{ steps.detect.outputs.backend }}
          BACKEND_DEEP: ${{ steps.detect.outputs.backend_deep }}
          WEB: ${{ steps.detect.outputs.web }}
          MOBILE: ${{ steps.detect.outputs.mobile }}
          API: ${{ steps.detect.outputs.api }}
          MIGRATION: ${{ steps.detect.outputs.migration }}
          SECURITY_DEEP: ${{ steps.detect.outputs.security_deep }}
        run: |
          set -euo pipefail
          validate_output() {
            local name="$1"
            local value="$2"
            case "$value" in
              true|false) ;;
              *) printf 'invalid %s change-risk output: %s\n' "$name" "$value" >&2; exit 1 ;;
            esac
          }
          validate_output backend "$BACKEND"
          validate_output backend_deep "$BACKEND_DEEP"
          validate_output web "$WEB"
          validate_output mobile "$MOBILE"
          validate_output api "$API"
          validate_output migration "$MIGRATION"
          validate_output security_deep "$SECURITY_DEEP"

  contract:
    name: OpenAPI contract
    needs: changes
    runs-on: ubuntu-latest
    steps:
      # 使用 Node 24 runtime 的稳定 Action 主版本，避免 Runner 强制兼容运行。
      # 破坏性变更检查需要读取 PR base commit，保留完整 Git 历史。
      - name: OpenAPI not applicable
        if: needs.changes.outputs.api != 'true'
        run: |
          printf '%s\n' 'not applicable: no OpenAPI or API contract changes'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.api == 'true'
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        if: needs.changes.outputs.api == 'true'
        with:
          version: 10.4.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: needs.changes.outputs.api == 'true'
        with:
          node-version: 22.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.api == 'true'
      # workflow_dispatch 没有真实 PR base；breaking comparison 对手动运行是 N/A，跳过不构成通过证据。
      - name: Check OpenAPI breaking changes against PR base
        if: needs.changes.outputs.api == 'true' && github.event_name == 'pull_request'
        env:
          OPENAPI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm api:breaking -- --base-ref "$OPENAPI_BASE_SHA"
      # 生成后要求工作树无差异，防止契约与提交的共享类型漂移。
      - run: pnpm run api:check
        if: needs.changes.outputs.api == 'true'
      - run: pnpm run api:generate
        if: needs.changes.outputs.api == 'true'
      - run: pnpm run api:types:check
        if: needs.changes.outputs.api == 'true'

  backend:
    name: Backend checks
    needs: changes
    # 上游 detector 失败时仍执行本 job 的输出校验，避免 needs 默认 skipped 被当作门禁通过。
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      # backend 与 backend_deep 都必须是 detector 明确写出的布尔值，缺失值直接阻断。
      - name: Validate backend change-risk outputs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BACKEND: ${{ needs.changes.outputs.backend }}
          BACKEND_DEEP: ${{ needs.changes.outputs.backend_deep }}
        run: |
          set -euo pipefail
          if [ "$CHANGES_RESULT" != 'success' ]; then
            printf 'changes job did not succeed: %s\n' "$CHANGES_RESULT" >&2
            exit 1
          fi
          case "$BACKEND" in
            true|false) ;;
            *) printf 'invalid backend change-risk output: %s\n' "$BACKEND" >&2; exit 1 ;;
          esac
          case "$BACKEND_DEEP" in
            true|false) ;;
            *) printf 'invalid backend_deep change-risk output: %s\n' "$BACKEND_DEEP" >&2; exit 1 ;;
          esac
      - name: Backend not applicable
        if: needs.changes.outputs.backend == 'false'
        run: |
          printf '%s\n' 'not applicable: no backend changes'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.backend == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        if: needs.changes.outputs.backend == 'true'
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Maven Wrapper 是后端唯一受支持的构建入口；R3 路径执行完整测试，其余后端改动先做编译验证。
      - name: Compile backend
        if: needs.changes.outputs.backend == 'true' && needs.changes.outputs.backend_deep == 'false'
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests compile
        working-directory: backend
      - name: Run backend deep tests
        if: needs.changes.outputs.backend == 'true' && needs.changes.outputs.backend_deep == 'true'
        run: ./mvnw --batch-mode --no-transfer-progress test
        working-directory: backend

  web:
    name: Web checks
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Web not applicable
        if: needs.changes.outputs.web != 'true'
        run: |
          printf '%s\n' 'not applicable: no web changes'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.web == 'true'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        if: needs.changes.outputs.web == 'true'
        with:
          version: 10.4.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: needs.changes.outputs.web == 'true'
        with:
          node-version: 22.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.web == 'true'
      # Web 的 check/test 脚本由工程自身声明，CI 不复制工具参数。
      - run: pnpm --filter web check
        if: needs.changes.outputs.web == 'true'
      - run: pnpm --filter web test
        if: needs.changes.outputs.web == 'true'

  mobile:
    name: Mobile checks
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Mobile not applicable
        if: needs.changes.outputs.mobile != 'true'
        run: |
          printf '%s\n' 'not applicable: no mobile changes'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.mobile == 'true'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        if: needs.changes.outputs.mobile == 'true'
        with:
          version: 10.4.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: needs.changes.outputs.mobile == 'true'
        with:
          node-version: 22.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.mobile == 'true'
      # Maestro 需原生模拟器，基础 CI 先执行类型、配置和单元检查。
      - run: pnpm --filter mobile check
        if: needs.changes.outputs.mobile == 'true'
      - run: pnpm --filter mobile test
        if: needs.changes.outputs.mobile == 'true'

  security:
    name: Security supply-chain gate
    needs: changes
    # 上游 detector 失败时仍执行本 job 的输出校验，避免 needs 默认 skipped 被当作门禁通过。
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      # 安全扫描执行链必须来自受信基线；PR 只提供待扫描数据，不能改写扫描器后自通过。
      - name: Verify trusted security scanner sources
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          set -euo pipefail
          git cat-file -e "${BASE_SHA}^{commit}"
          # 许可证检查会启动 Maven Wrapper，安装阶段会读取 pnpm/Maven 配置；这些执行输入也必须来自受信基线。
          for path in .npmrc .pnpmfile.cjs pnpmfile.cjs trivy.yaml trivy-secret.yaml .trivyignore .trivyignore.yaml scripts/detect-change-risk.mjs scripts/security-scan.sh scripts/check-licenses.mjs security/license-policy.json backend/pom.xml backend/mvnw backend/mvnw.cmd backend/.mvn backend/.mvn/maven.config backend/.mvn/jvm.config backend/.mvn/extensions.xml backend/.mvn/wrapper/maven-wrapper.properties; do
            if ! git diff --quiet "$BASE_SHA" -- "$path"; then
              printf 'security scanner source changed relative to trusted base: %s\n' "$path" >&2
              exit 1
            fi
          done
      # 缺失或非法决策值不能落入任一扫描分支，必须在安装和扫描前失败。
      - name: Validate security change-risk output
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SECURITY_DEEP: ${{ needs.changes.outputs.security_deep }}
        run: |
          set -euo pipefail
          if [ "$CHANGES_RESULT" != 'success' ]; then
            printf 'changes job did not succeed: %s\n' "$CHANGES_RESULT" >&2
            exit 1
          fi
          case "$SECURITY_DEEP" in
            true|false) ;;
            *) printf 'invalid security_deep change-risk output: %s\n' "$SECURITY_DEEP" >&2; exit 1 ;;
          esac
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.4.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.3
          cache: pnpm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # 直接下载并校验固定 Trivy 发布包，绕过 setup-trivy 的 Runner 路径兼容缺陷。
      - name: Install pinned Trivy
        env:
          TRIVY_VERSION: v0.74.0
          TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/trivy-bin"
          archive="$RUNNER_TEMP/trivy.tar.gz"
          mkdir -p "$install_dir"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/trivy_${TRIVY_VERSION#v}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  ${archive}" | sha256sum --check --status
          tar -xzf "$archive" -C "$install_dir" trivy
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/trivy" --version
      # 同时禁用 pnpmfile hook，避免 PR 工作区在安装阶段执行不受信 Node 代码。
      - run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
      # Trivy 的 Maven 解析器每次远程拉取 BOM 会触发 Maven Central 429；预取到本地 m2 缓存后
      # 扫描走本地仓库，避免外部限流导致的间歇性失败（与 Backend job 的 mvn 缓存共用）。
      - name: Prefetch Maven dependencies for Trivy cache
        if: needs.changes.outputs.security_deep == 'true'
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress -q -DskipTests dependency:go-offline
      # 普通 PR 只执行密钥快检；依赖、许可证和跨语言漏洞扫描仅在供应链相关变更时执行。
      - name: Run security fast scan
        if: needs.changes.outputs.security_deep == 'false'
        run: bash scripts/security-scan.sh secrets
      - name: Run security deep scan
        if: needs.changes.outputs.security_deep == 'true'
        run: bash scripts/security-scan.sh all

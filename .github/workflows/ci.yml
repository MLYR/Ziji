name: CI

on:
  # PR 是进入 main 前唯一自动完整门禁；合并后不重复执行同一套检查，手动排查仍可触发。
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支只保留最新流水线，减少过时检查占用执行资源。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      # 使用 Node 24 runtime 的稳定 Action 主版本，避免 Runner 强制兼容运行。
      # 破坏性变更检查需要读取 PR base commit，保留完整 Git 历史。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.4.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # workflow_dispatch 没有真实 PR base；breaking comparison 对手动运行是 N/A，跳过不构成通过证据。
      - name: Check OpenAPI breaking changes against PR base
        if: github.event_name == 'pull_request'
        env:
          OPENAPI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm api:breaking -- --base-ref "$OPENAPI_BASE_SHA"
      # 生成后要求工作树无差异，防止契约与提交的共享类型漂移。
      - run: pnpm run api:check
      - run: pnpm run api:generate
      - run: pnpm run api:types:check

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Maven Wrapper 是后端唯一受支持的构建入口。
      - run: ./mvnw --batch-mode --no-transfer-progress test
        working-directory: backend

  web:
    name: Web checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.4.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Web 的 check/test 脚本由工程自身声明，CI 不复制工具参数。
      - run: pnpm --filter web check
      - run: pnpm --filter web test

  mobile:
    name: Mobile checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.4.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Maestro 需原生模拟器，基础 CI 先执行类型、配置和单元检查。
      - run: pnpm --filter mobile check
      - run: pnpm --filter mobile test

  security:
    name: Security supply-chain gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.4.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.3
          cache: pnpm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # 直接下载并校验固定 Trivy 发布包，绕过 setup-trivy 的 Runner 路径兼容缺陷。
      - name: Install pinned Trivy
        env:
          TRIVY_VERSION: v0.74.0
          TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/trivy-bin"
          archive="$RUNNER_TEMP/trivy.tar.gz"
          mkdir -p "$install_dir"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/trivy_${TRIVY_VERSION#v}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  ${archive}" | sha256sum --check --status
          tar -xzf "$archive" -C "$install_dir" trivy
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/trivy" --version
      - run: pnpm install --frozen-lockfile
      # all 模式会汇总退出，但内部不短路：漏洞失败后仍执行许可证和密钥扫描。
      - run: pnpm security:scan

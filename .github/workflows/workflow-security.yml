name: Workflow security

on:
  # zizmor: ignore[dangerous-triggers] 仅使用默认分支受信逻辑，PR workflow 只作为 API 数据读取，不执行不受信代码。
  pull_request_target:
    branches: [main]

permissions:
  pull-requests: read

jobs:
  workflow-security:
    name: Workflow security
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Collect changed workflow files as data
        id: collect
        env:
          API_URL: ${{ github.api_url }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # 所有事件字段先做窄校验，避免把 PR 元数据解释成 shell 语法或路径。
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]

          scan_root="$GITHUB_WORKSPACE"
          mkdir -p "$scan_root/.github/workflows"
          # 将受信 contract 输入放在 runner 临时目录，与未受信 PR workflow 扫描目录物理隔离，避免同名文件覆盖。
          trusted_root="$RUNNER_TEMP/ziji-workflow-security-trusted"
          mkdir -p "$trusted_root"
          scan_inputs=''
          page=1

          while :; do
            response="$(curl --fail --silent --show-error --location \
              --proto '=https' --proto-redir '=https' --retry 3 \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              "$API_URL/repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100&page=$page")"
            printf '%s' "$response" | jq -e 'type == "array"' >/dev/null
            page_count="$(printf '%s' "$response" | jq 'length')"

            # 只下载发生变更的 workflow；删除项读取 base 版本，确保本次门禁始终有实际输入。
            workflow_items="$(printf '%s' "$response" | jq -r --arg base "$BASE_SHA" --arg head "$HEAD_SHA" --arg base_repo "$REPOSITORY" --arg head_repo "$HEAD_REPOSITORY" '
              .[] as $item
              | if ($item | type) != "object" then
                  error("PR files item must be an object")
                elif ($item.filename | type) != "string" then
                  error("PR files item filename must be a string")
                elif ($item.status | type) != "string" then
                  error("PR files item status must be a string")
                elif (($item.filename | startswith(".github/workflows/")) | not) then
                  empty
                elif (($item.filename | test("^\\.github/workflows/[A-Za-z0-9._/-]+\\.(yml|yaml)$")) | not)
                  or (($item.filename | contains(".."))) then
                  error("unsupported workflow path: \($item.filename)")
                elif (($item.status | test("^(added|modified|renamed|copied|removed)$")) | not) then
                  error("unknown workflow file status: \($item.status)")
                else
                  [$item.status, $item.filename,
                    (if $item.status == "removed" then $base else $head end),
                    (if $item.status == "removed" then $base_repo else $head_repo end)]
                  | @tsv
                end
            ' )" || {
              printf 'PR workflow file list validation failed\n' >&2
              exit 1
            }

            if [ -n "$workflow_items" ]; then
              while IFS=$'\t' read -r status filename ref source_repository; do
                [[ -n "$filename" ]]
                [[ "$filename" =~ ^\.github/workflows/[A-Za-z0-9._/-]+\.(yml|yaml)$ ]]
                [[ "$filename" != *'..'* ]]
                [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
                [[ "$source_repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]

                target="$scan_root/$filename"
                mkdir -p "$(dirname "$target")"
                curl --fail --silent --show-error --location \
                  --proto '=https' --proto-redir '=https' --retry 3 \
                  "https://raw.githubusercontent.com/$source_repository/$ref/$filename" \
                  --output "$target"
                scan_input="$filename"
                if [ -n "$scan_inputs" ]; then
                  scan_inputs="$scan_inputs $scan_input"
                else
                  scan_inputs="$scan_input"
                fi
              done <<< "$workflow_items"
            fi

            # GitHub 的 PR files API 最多返回 3000 个文件；到达该上限时拒绝不完整输入，避免漏扫后通过。
            if [ "$page" -ge 30 ] && [ "$page_count" -eq 100 ]; then
              printf 'PR files API reached its 3000-file limit; refusing incomplete workflow input\n' >&2
              exit 1
            fi
            if [ "$page_count" -lt 100 ]; then
              break
            fi
            page=$((page + 1))
          done

          # CI 安全 job 既要审计 YAML，也要与 trusted base 保持语义一致；删除该文件或改写为 no-op 都必须失败。
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --retry 3 \
            "https://raw.githubusercontent.com/$REPOSITORY/$BASE_SHA/.github/workflows/ci.yml" \
            --output "$trusted_root/ci-base.yml"
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --retry 3 \
            "https://raw.githubusercontent.com/$HEAD_REPOSITORY/$HEAD_SHA/.github/workflows/ci.yml" \
            --output "$trusted_root/ci.yml"
          # 该保护 workflow 本身运行在 pull_request_target 的 trusted base 上；仍需拒绝 PR 删除、重命名或改写它，避免合并后停用安全门禁。
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --retry 3 \
            "https://raw.githubusercontent.com/$REPOSITORY/$BASE_SHA/.github/workflows/workflow-security.yml" \
            --output "$trusted_root/workflow-security-base.yml"
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --retry 3 \
            "https://raw.githubusercontent.com/$HEAD_REPOSITORY/$HEAD_SHA/.github/workflows/workflow-security.yml" \
            --output "$trusted_root/workflow-security-head.yml"

          # 文件列表 API 没有 workflow 变更时显式成功结束；required job 本身始终运行。
          if [ -z "$scan_inputs" ]; then
            printf '%s\n' 'no workflow changes / not applicable'
            printf 'has_workflow_changes=false\n' >> "$GITHUB_OUTPUT"
            printf 'inputs=\n' >> "$GITHUB_OUTPUT"
          else
            printf 'has_workflow_changes=true\n' >> "$GITHUB_OUTPUT"
            printf 'inputs=%s\n' "$scan_inputs" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate collected workflow YAML
        # 先由受信解析器拒绝不可解析的 PR 数据，避免扫描器的收集警告被误记为通过。
        env:
          HAS_WORKFLOW_CHANGES: ${{ steps.collect.outputs.has_workflow_changes }}
          SCAN_ROOT: ${{ github.workspace }}/.github/workflows
        run: |
          set -euo pipefail
          if [[ "$HAS_WORKFLOW_CHANGES" == "false" ]]; then
            printf '%s\n' 'no workflow changes / not applicable'
            exit 0
          fi
          if [[ "$HAS_WORKFLOW_CHANGES" != "true" ]]; then
            printf 'invalid workflow-change state: %s\n' "$HAS_WORKFLOW_CHANGES" >&2
            exit 1
          fi

          ruby - "$SCAN_ROOT" <<'RUBY'
          require 'yaml'

          root = ARGV.fetch(0)
          paths = Dir.glob(File.join(root, '**', '*.{yml,yaml}')).sort
          abort '没有可解析的 workflow 输入' if paths.empty?

          paths.each do |path|
            YAML.parse_file(path)
          end
          RUBY

      - name: Verify CI security gate contract
        # 该步骤只解析 PR workflow 数据，不执行其中的 shell；安全 job 变化必须由 trusted base 明确放行。
        env:
          CI_BASE_WORKFLOW: ${{ runner.temp }}/ziji-workflow-security-trusted/ci-base.yml
          CI_HEAD_WORKFLOW: ${{ runner.temp }}/ziji-workflow-security-trusted/ci.yml
          WORKFLOW_SECURITY_BASE: ${{ runner.temp }}/ziji-workflow-security-trusted/workflow-security-base.yml
          WORKFLOW_SECURITY_HEAD: ${{ runner.temp }}/ziji-workflow-security-trusted/workflow-security-head.yml
        run: |
          set -euo pipefail

          ruby - "$CI_BASE_WORKFLOW" "$CI_HEAD_WORKFLOW" "$WORKFLOW_SECURITY_BASE" "$WORKFLOW_SECURITY_HEAD" <<'RUBY'
          require 'yaml'

          base_path, head_path, security_base_path, security_head_path = ARGV
          base = YAML.safe_load(File.read(base_path), aliases: true)
          head = YAML.safe_load(File.read(head_path), aliases: true)
          security_base = YAML.safe_load(File.read(security_base_path), aliases: true)
          security_head = YAML.safe_load(File.read(security_head_path), aliases: true)

          abort 'PR head 改写了 trusted Workflow security gate' unless security_head == security_base
          puts 'Workflow security gate matches trusted base.'

          def changes_job(workflow, label)
            jobs = workflow.fetch('jobs') { abort "#{label} 缺少 jobs" }
            job = jobs.fetch('changes') { abort "#{label} 缺少 changes job" }
            abort "#{label} changes job name 不匹配" unless job['name'] == 'Detect change risk'
            abort "#{label} changes job runner 不匹配" unless job['runs-on'] == 'ubuntu-latest'

            required_outputs = {
              'backend' => '${{ steps.detect.outputs.backend }}',
              'backend_deep' => '${{ steps.detect.outputs.backend_deep }}',
              'web' => '${{ steps.detect.outputs.web }}',
              'mobile' => '${{ steps.detect.outputs.mobile }}',
              'api' => '${{ steps.detect.outputs.api }}',
              'migration' => '${{ steps.detect.outputs.migration }}',
              'security_deep' => '${{ steps.detect.outputs.security_deep }}'
            }
            outputs = job.fetch('outputs') { abort "#{label} changes job 缺少 outputs" }
            required_outputs.each do |name, expression|
              abort "#{label} changes job 未导出 #{name}" unless outputs[name] == expression
            end

            steps = job.fetch('steps') { abort "#{label} changes job 缺少 steps" }
            detect_step = steps.find { |step| step.is_a?(Hash) && step['id'] == 'detect' }
            abort "#{label} changes job 缺少 detect step" unless detect_step
            abort "#{label} detect step name 不匹配" unless detect_step['name'] == 'Detect affected areas'
            abort "#{label} changes job 未直接调用受信 detector" unless detect_step['run'] == 'node scripts/detect-change-risk.mjs'

            required_env = {
              'GITHUB_BASE_SHA' => '${{ github.event.pull_request.base.sha }}',
              'GITHUB_EVENT_NAME' => '${{ github.event_name }}',
              'GITHUB_SHA' => '${{ github.event.pull_request.head.sha || github.sha }}'
            }
            env = detect_step.fetch('env') { abort "#{label} detect step 缺少 env" }
            required_env.each do |name, expression|
              abort "#{label} detect step 未保护 #{name}" unless env[name] == expression
            end
            job
          end

          def backend_job(workflow, label)
            jobs = workflow.fetch('jobs') { abort "#{label} 缺少 jobs" }
            job = jobs.fetch('backend') { abort "#{label} 缺少 backend job" }
            abort "#{label} backend job name 不匹配" unless job['name'] == 'Backend checks'
            abort "#{label} backend job 必须依赖 changes" unless job['needs'] == 'changes'
            abort "#{label} backend job 必须在 changes 失败后执行输出校验" unless job['if'] == '${{ always() }}'

            steps = job.fetch('steps') { abort "#{label} backend job 缺少 steps" }
            validation_step = steps.find { |step| step.is_a?(Hash) && step['name'] == 'Validate backend change-risk outputs' }
            not_applicable_step = steps.find { |step| step.is_a?(Hash) && step['name'] == 'Backend not applicable' }
            compile_step = steps.find { |step| step.is_a?(Hash) && step['name'] == 'Compile backend' }
            deep_step = steps.find { |step| step.is_a?(Hash) && step['name'] == 'Run backend deep tests' }
            abort "#{label} 缺少 backend change-risk fail-closed 校验" unless validation_step
            validation_env = validation_step.fetch('env') { abort "#{label} backend change-risk 校验缺少 changes 结果输入" }
            validation_run = validation_step.fetch('run')
            abort "#{label} backend change-risk 校验未读取 needs.changes.result" unless validation_env['CHANGES_RESULT'] == '${{ needs.changes.result }}'
            abort "#{label} backend change-risk 校验未限制为 true/false" unless validation_run.include?('true|false')
            abort "#{label} backend change-risk 校验未阻断 changes 失败" unless validation_run.include?("!= 'success'")
            abort "#{label} 缺少 backend not applicable step" unless not_applicable_step
            abort "#{label} 缺少 backend compile step" unless compile_step
            abort "#{label} 缺少 backend deep step" unless deep_step
            abort "#{label} backend not applicable 条件不是精确 false" unless not_applicable_step['if'] == "needs.changes.outputs.backend == 'false'"
            abort "#{label} backend compile 条件不是精确 false" unless compile_step['if'] == "needs.changes.outputs.backend == 'true' && needs.changes.outputs.backend_deep == 'false'"
            abort "#{label} backend deep 条件不是精确 true" unless deep_step['if'] == "needs.changes.outputs.backend == 'true' && needs.changes.outputs.backend_deep == 'true'"
            abort "#{label} backend compile 入口不匹配" unless compile_step['run'] == './mvnw --batch-mode --no-transfer-progress -DskipTests compile'
            abort "#{label} backend deep 入口不匹配" unless deep_step['run'] == './mvnw --batch-mode --no-transfer-progress test'
            job
          end

          def security_job(workflow, label)
            jobs = workflow.fetch('jobs') { abort "#{label} 缺少 jobs" }
            job = jobs.fetch('security') { abort "#{label} 缺少 security job" }
            abort "#{label} security job name 不匹配" unless job['name'] == 'Security supply-chain gate'
            abort "#{label} security job 必须在 changes 失败后执行输出校验" unless job['if'] == '${{ always() }}'
            job
          end

          def validate_security_contract(job, label)
            abort "#{label} security job 必须依赖 changes" unless job['needs'] == 'changes'
            steps = job.fetch('steps') { abort "#{label} security job 缺少 steps" }
            guard_index = steps.index { |step| step.is_a?(Hash) && step['name'] == 'Verify trusted security scanner sources' }
            abort "#{label} 缺少 trusted source guard" unless guard_index

            guard_run = steps[guard_index].fetch('run')
            required_paths = %w[
              .npmrc
              .pnpmfile.cjs
              pnpmfile.cjs
              trivy.yaml
              trivy-secret.yaml
              .trivyignore
              .trivyignore.yaml
              scripts/detect-change-risk.mjs
              scripts/security-scan.sh
              scripts/check-licenses.mjs
              security/license-policy.json
              backend/pom.xml
              backend/mvnw
              backend/mvnw.cmd
              backend/.mvn
              backend/.mvn/maven.config
              backend/.mvn/jvm.config
              backend/.mvn/extensions.xml
              backend/.mvn/wrapper/maven-wrapper.properties
            ]
            required_paths.each do |path|
              abort "#{label} trusted source guard 未保护 #{path}" unless guard_run.include?(path)
            end
            abort "#{label} trusted source guard 未执行 git diff --quiet" unless guard_run.include?('git diff --quiet')

            validation_index = steps.index { |step| step.is_a?(Hash) && step['name'] == 'Validate security change-risk output' }
            abort "#{label} 缺少 security change-risk fail-closed 校验" unless validation_index
            validation_step = steps[validation_index]
            validation_env = validation_step.fetch('env') { abort "#{label} security change-risk 校验缺少 changes 结果输入" }
            validation_run = validation_step.fetch('run')
            abort "#{label} security change-risk 校验未读取 needs.changes.result" unless validation_env['CHANGES_RESULT'] == '${{ needs.changes.result }}'
            abort "#{label} security change-risk 校验未限制为 true/false" unless validation_run.include?('true|false')
            abort "#{label} security change-risk 校验未阻断 changes 失败" unless validation_run.include?("!= 'success'")

            install_index = steps.index { |step| step.is_a?(Hash) && step['run'] == 'pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile' }
            fast_index = steps.index { |step| step.is_a?(Hash) && step['name'] == 'Run security fast scan' }
            deep_index = steps.index { |step| step.is_a?(Hash) && step['name'] == 'Run security deep scan' }
            abort "#{label} 缺少 --ignore-scripts 安装" unless install_index
            abort "#{label} 缺少 security fast scan" unless fast_index
            abort "#{label} 缺少 security deep scan" unless deep_index
            fast_step = steps[fast_index]
            deep_step = steps[deep_index]
            abort "#{label} fast scan 条件不是精确 false" unless fast_step['if'] == "needs.changes.outputs.security_deep == 'false'"
            abort "#{label} deep scan 条件不是精确 true" unless deep_step['if'] == "needs.changes.outputs.security_deep == 'true'"
            abort "#{label} fast scan 入口不匹配" unless fast_step['run'] == 'bash scripts/security-scan.sh secrets'
            abort "#{label} deep scan 入口不匹配" unless deep_step['run'] == 'bash scripts/security-scan.sh all'
            abort "#{label} 安全扫描命令早于 trusted source guard 或决策校验" unless guard_index < validation_index && validation_index < install_index && install_index < fast_index && install_index < deep_index
            abort "#{label} 仍调用可改写的 pnpm security:scan" if steps.any? { |step| step.is_a?(Hash) && step['run'].to_s.include?('pnpm security:scan') }
          end

          # Security job 继承 workflow 顶层执行上下文；这些字段也必须与 trusted base 一致，避免改写扫描器、触发器、权限或并发行为。
          %w[env defaults permissions concurrency].each do |key|
            abort "PR head 改写了 workflow 顶层 #{key}" unless head[key] == base[key]
          end
          # Psych 按 YAML 1.1 将未加引号的 on 解析为布尔键，显式比较该键以保护 pull_request 触发器。
          abort 'PR head 改写了 workflow 顶层 on' unless head[true] == base[true]

          base_changes = changes_job(base, 'trusted base')
          head_changes = changes_job(head, 'PR head')
          abort 'PR head 改写了 trusted base 的 Detect change risk job' unless head_changes == base_changes

          base_backend = backend_job(base, 'trusted base')
          head_backend = backend_job(head, 'PR head')
          abort 'PR head 改写了 trusted base 的 Backend checks job' unless head_backend == base_backend

          base_security = security_job(base, 'trusted base')
          head_security = security_job(head, 'PR head')
          validate_security_contract(base_security, 'trusted base')
          validate_security_contract(head_security, 'PR head')
          abort 'PR head 改写了 trusted base 的 Security supply-chain gate' unless head_security == base_security
          puts 'CI Security supply-chain gate contract matches trusted base.'
          RUBY

      - name: Audit workflow data with pinned zizmor
        # 固定镜像 digest 并启用 strict collection；下载、解析、审计和输出失败均保持非零。
        env:
          HAS_WORKFLOW_CHANGES: ${{ steps.collect.outputs.has_workflow_changes }}
          SCAN_INPUTS: ${{ steps.collect.outputs.inputs }}
        run: |
          set -euo pipefail
          if [[ "$HAS_WORKFLOW_CHANGES" == "false" ]]; then
            printf '%s\n' 'no workflow changes / not applicable'
            exit 0
          fi
          if [[ "$HAS_WORKFLOW_CHANGES" != "true" ]]; then
            printf 'invalid workflow-change state: %s\n' "$HAS_WORKFLOW_CHANGES" >&2
            exit 1
          fi

          image='ghcr.io/zizmorcore/zizmor:1.29.0@sha256:863026d54f91271b10b60b67ad8054cb37120167e162482597db102b3026a284'
          docker pull "$image"
          read -r -a inputs <<< "$SCAN_INPUTS"
          ((${#inputs[@]} > 0))
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --workdir /workspace \
            "$image" \
            --offline \
            --strict-collection \
            --persona=regular \
            --collect=default \
            --color=never \
            -- "${inputs[@]}"
